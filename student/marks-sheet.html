<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPS Pethgam Wagoora - Professional Marksheet System</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            .page-break {
                page-break-after: always;
                display: block;
            }
            body {
                background: white;
                padding: 0;
                margin: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .marksheet-container {
                margin: 10px auto;
                border: 4px solid #6d59c0 !important;
                box-shadow: none;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                page-break-inside: avoid;
            }
            /* hide all marksheets except the one being printed */
            .marksheet-container:not(.active-print) {
                display: none !important;
            }
        }

        .marksheet-container {
            background: white;
            width: 210mm;
            min-height: 290mm;
            padding: 15px;
            margin: 20px auto;
            position: relative;
            border: 4px solid #6d59c0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .marksheet-container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            width: 400px;
            height: 400px;
            background-image: url('new-logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .header-bg {
            position: relative;
            z-index: 1;
            background-color: #6d59c0 !important;
            color: white !important;
            border-bottom: 2px solid #000;
        }
        .cell-label {
            background-color: #e0e7ff !important;
            color: #1e40af !important;
            font-weight: bold;
            border: 1px solid #94a3b8;
            padding: 4px;
            font-size: 11px;
        }
        .cell-value {
            border: 1px solid #94a3b8;
            padding: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            color: #000;
        }
        table {
            position: relative;
            z-index: 1;
            border-collapse: collapse;
            width: 100%;
        }
        th,
        td {
            border: 1px solid #94a3b8;
            text-align: center;
            font-size: 11px;
            padding: 3px;
        }
        .sub-name {
            color: #b91c1c;
            text-align: left;
            font-weight: bold;
            padding-left: 5px;
            font-size: 12px;
        }
        .footer-tab {
            background-color: #334155 !important;
            color: white !important;
            font-size: 10px;
            padding: 6px;
            text-align: center;
            border: 1px solid #000;
        }
        .photo-box {
            position: relative;
            z-index: 1;
            width: 110px;
            height: 120px;
            border: 2px solid #6d59c0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }
        .bar-container {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 8px;
            padding: 10px;
            border-bottom: 2px solid #334155;
        }
        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }
        .bar {
            width: 100%;
            background-color: #3b82f6 !important;
            border: 1px solid #1e40af;
            min-height: 1px;
        }
        .prof-img {
            width: 40px;
            height: 30px;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .grid,
        .border,
        .flex {
            position: relative;
            z-index: 1;
        }

        /* toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .toast.success {
            background: #065f46;
            border-left: 6px solid #34d399;
        }
        .toast.error {
            background: #7f1d1d;
            border-left: 6px solid #f87171;
        }
        .toast.info {
            background: #1e3a5f;
            border-left: 6px solid #60a5fa;
        }

        /* spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-sm {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-sm:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }

        .action-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            align-items: center;
        }

        /* Firestore config card */
        .config-card {
            border: 2px dashed #6d59c0;
            background: #f8f5ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .config-card input {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            width: 100%;
        }
        .config-card label {
            font-weight: 600;
            font-size: 12px;
            color: #334155;
            display: block;
            margin-bottom: 2px;
        }
        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .config-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- ====== TOP PANEL ====== -->
    <div class="no-print max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-xl mb-10 border-b-4 border-indigo-600">

        <!-- Title & Print All -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-3">
            <h2 class="text-2xl font-bold text-indigo-900">📋 GPS Pethgam Marksheet Panel</h2>
            <div class="flex flex-wrap gap-3">
                <button onclick="window.print()" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold hover:bg-indigo-700 transition">
                    🖨️ Print All (PDF)
                </button>
                <button onclick="saveAllToFirestore()" class="bg-emerald-600 text-white px-6 py-2 rounded font-bold hover:bg-emerald-700 transition" id="saveAllBtn">
                    ☁️ Save All to Firestore
                </button>
            </div>
        </div>

        <!-- Firestore Config -->
        <div class="config-card">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-indigo-800">🔥 Firestore Configuration</span>
                <button onclick="toggleFirestoreConfig()" class="text-sm text-indigo-600 underline">Toggle</button>
            </div>
            <div id="firestoreConfigArea">
                <div class="config-row">
                    <div>
                        <label>Project ID</label>
                        <input id="fbProjectId" placeholder="your-project-id" value="gps-pethgam-marksheet" />
                    </div>
                    <div>
                        <label>Collection Name</label>
                        <input id="fbCollection" placeholder="marksheets" value="marksheets" />
                    </div>
                </div>
                <div class="text-xs text-slate-500 mt-2">
                    ⚠️ Make sure Firestore security rules allow writes. For production, use environment variables.
                </div>
            </div>
        </div>

        <!-- Upload Excel -->
        <div class="mb-6 p-4 bg-indigo-50 rounded-lg">
            <label class="block text-sm font-bold text-indigo-900 mb-2">📂 Upload Excel Data</label>
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700" />
        </div>

        <!-- Student List -->
        <div id="studentListControl" class="hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-2 border">Roll</th>
                            <th class="p-2 border">Name</th>
                            <th class="p-2 border">Photo</th>
                            <th class="p-2 border">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ====== MARKSHEET WRAPPER ====== -->
    <div id="marksheetWrapper"></div>

    <script>
        // ============================================================
        // 1. GLOBALS
        // ============================================================
        let allStudentsData = [];
        let studentPhotos = {};
        let firebaseInitialized = false;

        // ============================================================
        // 2. TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.className = `toast ${type} show`;
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        // ============================================================
        // 3. FIRESTORE INIT
        // ============================================================
        function getFirestoreConfig() {
            const projectId = document.getElementById('fbProjectId').value.trim() || 'gps-pethgam-marksheet';
            const collection = document.getElementById('fbCollection').value.trim() || 'marksheets';
            return { projectId, collection };
        }

        function initFirebase() {
            try {
                const { projectId } = getFirestoreConfig();
                // Use a default config – user can override with their own
                const firebaseConfig = {
                    apiKey: "AIzaSyDummyKeyForDemoPurposesOnly",
                    authDomain: `${projectId}.firebaseapp.com`,
                    projectId: projectId,
                    storageBucket: `${projectId}.appspot.com`,
                    messagingSenderId: "123456789",
                    appId: "1:123456789:web:abcdef"
                };
                // If Firebase is already initialized, use existing app
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                firebaseInitialized = true;
                return firebase.firestore();
            } catch (e) {
                console.warn('Firebase init warning:', e);
                showToast('⚠️ Firebase not configured. Save disabled.', 'error');
                firebaseInitialized = false;
                return null;
            }
        }

        function getDb() {
            if (!firebaseInitialized) return initFirebase();
            return firebase.firestore();
        }

        // ============================================================
        // 4. EXCEL UPLOAD
        // ============================================================
        document.getElementById('excelUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    allStudentsData = rows.slice(3).filter(r => r[3]);
                    if (allStudentsData.length === 0) {
                        showToast('No student data found in Excel.', 'error');
                        return;
                    }
                    renderStudentList();
                    generateAllMarksheets();
                    showToast(`✅ Loaded ${allStudentsData.length} students.`, 'success');
                } catch (err) {
                    showToast('❌ Error reading Excel: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ============================================================
        // 5. STUDENT LIST
        // ============================================================
        function renderStudentList() {
            const container = document.getElementById('studentListControl');
            const tbody = document.getElementById('studentTableBody');
            container.classList.remove('hidden');
            tbody.innerHTML = '';
            allStudentsData.forEach((row, index) => {
                const name = row[3] ? row[3].toString().toUpperCase() : "UNKNOWN";
                const admNo = row[0] || '000';
                const hasPhoto = !!studentPhotos[name];
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 border text-center font-bold">${row[1] || '-'}</td>
                        <td class="p-2 border font-bold">${name}</td>
                        <td class="p-2 border text-center" id="status-${index}">${hasPhoto ? '✅' : '❌'}</td>
                        <td class="p-2 border">
                            <div class="action-cell">
                                <input type="file" id="input-${index}" class="hidden" accept="image/*" onchange="uploadPhoto(this, '${name}', ${index})">
                                <button onclick="document.getElementById('input-${index}').click()" class="btn-sm bg-emerald-500 text-white">📷 Photo</button>
                                <button onclick="downloadIndividual('${admNo}')" class="btn-sm bg-blue-600 text-white">⬇️ PDF</button>
                                <button onclick="saveSingleToFirestore('${admNo}')" class="btn-sm bg-purple-600 text-white">☁️ Save</button>
                            </div>
                        </td>
                    </tr>`;
            });
        }

        function uploadPhoto(input, name, index) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    studentPhotos[name] = e.target.result;
                    const statusEl = document.getElementById(`status-${index}`);
                    if (statusEl) statusEl.innerText = '✅';
                    generateAllMarksheets();
                    showToast(`📸 Photo updated for ${name}`, 'success');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ============================================================
        // 6. GRADE & PROFICIENCY HELPERS
        // ============================================================
        function getGrade(s) {
            let score = Number(s) || 0;
            if (score >= 85) return 'A+';
            if (score >= 70) return 'A';
            if (score >= 55) return 'B';
            if (score >= 40) return 'C';
            if (score >= 33) return 'D';
            return 'E';
        }

        function getProficiency(s) {
            let score = Number(s) || 0;
            if (score >= 85) return 'Sky';
            if (score >= 55) return 'Mountain';
            return 'Stream';
        }

        // ============================================================
        // 7. BUILD STUDENT DATA OBJECT (for Firestore & marksheet)
        // ============================================================
        function buildStudentData(row) {
            const name = row[3] ? row[3].toString().toUpperCase() : "UNKNOWN";
            const admNo = row[0] || '000';

            const subjects = [
                { n: 'English', g: row[17] || 0, fa: [row[8], row[9], row[10], row[11], row[12], row[13]], t: row[14] || 0,
                    cc: row[15] || 0, s: row[16] || 0 },
                { n: 'Math', g: row[27] || 0, fa: [row[18], row[19], row[20], row[21], row[22], row[23]], t: row[24] || 0,
                    cc: row[25] || 0, s: row[26] || 0 },
                { n: 'EVS', g: row[37] || 0, fa: [row[28], row[29], row[30], row[31], row[32], row[33]], t: row[34] || 0,
                    cc: row[35] || 0, s: row[36] || 0 },
                { n: 'Urdu', g: row[47] || 0, fa: [row[38], row[39], row[40], row[41], row[42], row[43]], t: row[44] || 0,
                    cc: row[45] || 0, s: row[46] || 0 },
                { n: 'Kashmiri', g: row[57] || 0, fa: [row[48], row[49], row[50], row[51], row[52], row[53]], t: row[54] || 0,
                    cc: row[55] || 0, s: row[56] || 0 }
            ];

            const total = subjects.reduce((a, b) => a + (Number(b.g) || 0), 0);
            const perc = total / 5;

            // Ranks (will be computed later in generateAllMarksheets)
             // We'll compute ranks in the marksheet generation phase

            const grandFA = [0, 0, 0, 0, 0, 0];
            subjects.forEach(s => { s.fa.forEach((v, i) => grandFA[i] += (Number(v) || 0)); });
            const grandT30 = subjects.reduce((a, b) => a + (Number(b.t) || 0), 0);
            const grandCC20 = subjects.reduce((a, b) => a + (Number(b.cc) || 0), 0);
            const grandSum50 = subjects.reduce((a, b) => a + (Number(b.s) || 0), 0);
            const grandTotal100 = subjects.reduce((a, b) => a + (Number(b.g) || 0), 0);

            const bestSub = subjects.reduce((prev, curr) => (Number(prev.g) > Number(curr.g)) ? prev : curr);
            const weakSub = subjects.reduce((prev, curr) => (Number(prev.g) < Number(curr.g)) ? prev : curr);

            return {
                admNo,
                name,
                rollNo: row[1] || '',
                class: row[2] || '',
                fatherName: row[4] || '',
                motherName: row[5] || '',
                dob: row[7] || '',
                apaarId: row[65] || 'N/A',
                penNo: row[66] || 'N/A',
                photo: studentPhotos[name] || '',
                subjects: subjects.map(s => ({
                    name: s.n,
                    total: Number(s.g) || 0,
                    grade: getGrade(s.g),
                    proficiency: getProficiency(s.g),
                    fa1: Number(s.fa[0]) || 0,
                    fa2: Number(s.fa[1]) || 0,
                    fa3: Number(s.fa[2]) || 0,
                    fa4: Number(s.fa[3]) || 0,
                    fa5: Number(s.fa[4]) || 0,
                    fa6: Number(s.fa[5]) || 0,
                    t: Number(s.t) || 0,
                    cc: Number(s.cc) || 0,
                    s: Number(s.s) || 0,
                })),
                grandTotal: total,
                percentage: parseFloat(perc.toFixed(1)),
                overallGrade: getGrade(perc),
                proficiencyLevel: getProficiency(perc),
                result: perc >= 33 ? 'PROMOTED' : 'REPEATER',
                bestSubject: bestSub.n,
                bestSubjectMarks: Number(bestSub.g),
                weakSubject: weakSub.n,
                weakSubjectMarks: Number(weakSub.g),
                grandFA: grandFA,
                grandT30: grandT30,
                grandCC20: grandCC20,
                grandSum50: grandSum50,
                grandTotal100: grandTotal100,
                // ranks will be filled later
                schoolRank: 0,
                classRank: 0,
                timestamp: new Date().toISOString()
            };
        }

        // ============================================================
        // 8. GENERATE ALL MARKSHEETS
        // ============================================================
        function generateAllMarksheets() {
            const wrapper = document.getElementById('marksheetWrapper');
            wrapper.innerHTML = '';
            if (allStudentsData.length === 0) return;

            // Build student objects with totals for ranking
            const studentsWithTotals = allStudentsData.map(row => ({
                row: row,
                total: (Number(row[17]) || 0) + (Number(row[27]) || 0) + (Number(row[37]) || 0) + (Number(row[47]) || 0) + (
                    Number(row[57]) || 0),
                class: row[2] || ''
            }));

            const schoolSorted = [...studentsWithTotals].sort((a, b) => b.total - a.total);

            studentsWithTotals.forEach((std, idx) => {
                const row = std.row;
                const name = row[3] ? row[3].toString().toUpperCase() : "UNKNOWN";
                const admNo = row[0] || '000';

                const sRank = schoolSorted.findIndex(s => s.total === std.total) + 1;
                const classStudents = studentsWithTotals.filter(s => s.class === std.class);
                const classSorted = [...classStudents].sort((a, b) => b.total - a.total);
                const cRank = classSorted.findIndex(s => s.total === std.total) + 1;

                // Store rank in the data object for Firestore
                const dataObj = buildStudentData(row);
                dataObj.schoolRank = sRank;
                dataObj.classRank = cRank;

                const subjects = [
                    { n: 'English', g: row[17] || 0, fa: [row[8], row[9], row[10], row[11], row[12], row[13]], t: row[14] || 0,
                        cc: row[15] || 0, s: row[16] || 0 },
                    { n: 'Math', g: row[27] || 0, fa: [row[18], row[19], row[20], row[21], row[22], row[23]], t: row[24] || 0,
                        cc: row[25] || 0, s: row[26] || 0 },
                    { n: 'EVS', g: row[37] || 0, fa: [row[28], row[29], row[30], row[31], row[32], row[33]], t: row[34] || 0,
                        cc: row[35] || 0, s: row[36] || 0 },
                    { n: 'Urdu', g: row[47] || 0, fa: [row[38], row[39], row[40], row[41], row[42], row[43]], t: row[44] || 0,
                        cc: row[45] || 0, s: row[46] || 0 },
                    { n: 'Kashmiri', g: row[57] || 0, fa: [row[48], row[49], row[50], row[51], row[52], row[53]], t: row[54] ||
                            0, cc: row[55] || 0, s: row[56] || 0 }
                ];

                const perc = std.total / 5;
                const bestSub = subjects.reduce((prev, curr) => (Number(prev.g) > Number(curr.g)) ? prev : curr);
                const weakSub = subjects.reduce((prev, curr) => (Number(prev.g) < Number(curr.g)) ? prev : curr);

                const grandFA = [0, 0, 0, 0, 0, 0];
                subjects.forEach(s => { s.fa.forEach((v, i) => grandFA[i] += (Number(v) || 0)); });
                const grandT30 = subjects.reduce((a, b) => a + (Number(b.t) || 0), 0);
                const grandCC20 = subjects.reduce((a, b) => a + (Number(b.cc) || 0), 0);
                const grandSum50 = subjects.reduce((a, b) => a + (Number(b.s) || 0), 0);
                const grandTotal100 = subjects.reduce((a, b) => a + (Number(b.g) || 0), 0);

                // Store the data object on the row for later use
                row._dataObj = dataObj;

                const div = document.createElement('div');
                div.className = 'marksheet-container page-break';
                div.id = `marksheet-${admNo}`;
                div.setAttribute('data-adm', admNo);

                div.innerHTML = `
                    <div class="header-bg p-2 flex justify-between items-center">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-white">
                            <img src="new-logo.png" alt="School Logo" class="w-full h-full object-contain" onerror="this.style.display='none'">
                        </div>
                        <div class="text-center flex-grow">
                            <h1 class="text-2xl font-black uppercase leading-tight">Government Primary School</h1>
                            <h2 class="text-lg font-bold leading-tight">PETHGAM WAGOORA 193109</h2>
                            <p class="text-[10px] font-medium uppercase tracking-wide">Wagoora Babareshi Road Near Zonal Education office Wagoora</p>
                        </div>
                    </div>

                    <div class="flex mt-1">
                        <div class="flex-grow grid grid-cols-4 border-l border-t">

                        <div class="border border-slate-300">
                            <div class="bg-purple-600 text-white text-[10px] font-bold text-center py-1">Final Results</div>
                            <table class="w-full text-[10px] text-left">
                                <tr><td class="bg-blue-50 px-1 border">Total Marks Obtained</td><td class="font-bold border text-center">${std.total}</td></tr>
                                <tr><td class="bg-blue-50 px-1 border">Max. Marks</td><td class="font-bold border text-center">500</td></tr>
                                <tr><td class="bg-blue-50 px-1 border">Overall %age</td><td class="font-bold border text-center">${perc.toFixed(1)}%</td></tr>
                                <tr><td class="bg-blue-50 px-1 border">Result</td><td class="font-bold border text-center">${perc >= 33 ? 'PROMOTED' : 'REPEATER'}</td></tr>
                                <tr><td class="bg-blue-50 px-1 border">Class Position</td><td class="font-bold border text-center">${cRank === 1 ? '1st Position' : cRank === 2 ? '2nd Position' : cRank === 3 ? '3rd Position' : 'Qualified'}</td></tr>
                            </table>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-1 mt-1">
                        <div class="border p-1">
                            <div class="bg-orange-400 text-white text-[10px] font-bold text-center mb-1">Subject wise Bar Graph Chart</div>
                            <div class="bar-container">
                                ${subjects.map(s => `<div class="bar-item"><span class="text-[9px]">${s.g}</span><div class="bar" style="height: ${s.g}%;"></div><span class="text-[8px]">${s.n}</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="grid grid-rows-2 gap-1">
                            <div class="grid grid-cols-2 gap-1">
                                <div class="border border-slate-700 text-center"><div class="bg-slate-700 text-white text-[9px] py-1">SCHOOL RANK</div><div class="text-xl font-bold">${sRank}</div></div>
                                <div class="border border-slate-700 text-center"><div class="bg-slate-700 text-white text-[9px] py-1">CLASS RANK</div><div class="text-xl font-bold">${cRank}</div></div>
                            </div>
                            <div class="border border-slate-400">
                                <table class="w-full h-full text-[9px] border-collapse">
                                    <tr>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Attendance</td>
                                        <td class="border border-slate-400 w-12"></td>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Discipline</td>
                                        <td class="border border-slate-400 w-12"></td>
                                    </tr>
                                    <tr>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Sports</td>
                                        <td class="border border-slate-400"></td>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Art & Craft</td>
                                        <td class="border border-slate-400"></td>
                                    </tr>
                                    <tr>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Teamwork</td>
                                        <td class="border border-slate-400"></td>
                                        <td class="bg-red-700 text-white font-bold px-1 border border-slate-400">Social Skills</td>
                                        <td class="border border-slate-400"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="border border-slate-400 mt-1">
                        <div class="bg-purple-500 text-white text-[10px] font-bold text-center py-1 uppercase">General Remarks</div>
                        <div class="p-2 text-[11px] font-bold min-h-[60px]">
                            ${name} has shown ${getProficiency(perc)} level performance. Exceptional in ${bestSub.n} (${bestSub.g}). 
                            ${perc < 55 ? 'Focus needed on ' + weakSub.n + '.' : 'Keep maintaining excellence.'} Overall: ${getGrade(perc)}.
                        </div>
                    </div>

                    <div class="flex justify-between items-end px-4 mt-4">
                        <div class="text-center">
                            <svg id="barcode-${admNo}"></svg>
                            <p class="text-[8px] uppercase font-bold text-slate-500">Student Identity Barcode</p>
                        </div>
                        <div class="text-center">
                            <div id="qrcode-${admNo}" class="mx-auto bg-white p-1 border border-slate-800"></div>
                            <p class="text-[8px] uppercase font-bold mt-1 text-slate-500">Scan for Verification</p>
                        </div>
                    </div>

                    <div class="mt-16"></div>

                    <div class="grid grid-cols-4 gap-4 px-2">
                        <div class="footer-tab border-t-2 border-slate-500 pt-2 font-bold">Sign. Form Teacher</div>
                        <div class="footer-tab border-t-2 border-slate-500 pt-2 font-bold">Sign. Exam I/C</div>
                        <div class="footer-tab border-t-2 border-slate-500 pt-2 font-bold">Parents Signature</div>
                        <div class="footer-tab border-t-2 border-slate-500 pt-2 font-bold">Seal & Sign. Headmaster</div>
                    </div>
                `;
                wrapper.appendChild(div);

                // Barcode & QR
                setTimeout(() => {
                    try {
                        JsBarcode(`#barcode-${admNo}`, admNo.toString(), {
                            format: "CODE39",
                            width: 1.5,
                            height: 40,
                            displayValue: true,
                            fontSize: 10,
                            margin: 5
                        });
                    } catch (e) { console.warn('Barcode error', e); }
                    try {
                        const qrEl = document.getElementById(`qrcode-${admNo}`);
                        if (qrEl) {
                            new QRCode(qrEl, {
                                text: `VERIFIED: ${name} | Adm: ${admNo} | GPS Pethgam Wagoora`,
                                width: 80,
                                height: 80,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.M
                            });
                        }
                    } catch (e) { console.warn('QR error', e); }
                }, 150);
            });
        }

        // ============================================================
        // 9. INDIVIDUAL DOWNLOAD (PDF via print)
        // ============================================================
        function downloadIndividual(admNo) {
            const allMarksheets = document.querySelectorAll('.marksheet-container');
            if (allMarksheets.length === 0) {
                showToast('No marksheets to download.', 'error');
                return;
            }

            // Find target
            let target = null;
            allMarksheets.forEach(el => {
                if (el.getAttribute('data-adm') === admNo) {
                    target = el;
                }
            });

            if (!target) {
                showToast(`Marksheet for Adm ${admNo} not found.`, 'error');
                return;
            }

            // Hide all, show target
            allMarksheets.forEach(el => el.classList.remove('active-print'));
            target.classList.add('active-print');

            // Also hide the top panel and other UI elements during print
            const panel = document.querySelector('.no-print');
            if (panel) panel.style.display = 'none';

            // Print
            window.print();

            // Restore after print
            setTimeout(() => {
                allMarksheets.forEach(el => el.classList.remove('active-print'));
                if (panel) panel.style.display = '';
                showToast(`📄 Marksheet for Adm ${admNo} sent to print.`, 'info');
            }, 1000);
        }

        // ============================================================
        // 10. FIRESTORE SAVE FUNCTIONS
        // ============================================================
        async function saveSingleToFirestore(admNo) {
            const btn = event && event.target ? event.target : document.querySelector(`[onclick*="saveSingleToFirestore('${admNo}')"]`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span>Saving...';
            }

            try {
                const db = getDb();
                if (!db) {
                    showToast('❌ Firebase not initialized. Check config.', 'error');
                    if (btn) { btn.disabled = false;
                        btn.innerHTML = '☁️ Save'; }
                    return;
                }

                // Find the student row
                const row = allStudentsData.find(r => (r[0] || '000') === admNo);
                if (!row) {
                    showToast(`❌ Student with Adm ${admNo} not found.`, 'error');
                    if (btn) { btn.disabled = false;
                        btn.innerHTML = '☁️ Save'; }
                    return;
                }

                // Build data object (includes ranks)
                let dataObj = row._dataObj;
                if (!dataObj) {
                    // Rebuild if not stored
                    dataObj = buildStudentData(row);
                    // compute ranks
                    const studentsWithTotals = allStudentsData.map(r => ({
                        row: r,
                        total: (Number(r[17]) || 0) + (Number(r[27]) || 0) + (Number(r[37]) || 0) + (Number(r[47]) || 0) + (
                            Number(r[57]) || 0),
                        class: r[2] || ''
                    }));
                    const schoolSorted = [...studentsWithTotals].sort((a, b) => b.total - a.total);
                    const sRank = schoolSorted.findIndex(s => s.total === dataObj.grandTotal) + 1;
                    const classStudents = studentsWithTotals.filter(s => s.class === dataObj.class);
                    const classSorted = [...classStudents].sort((a, b) => b.total - a.total);
                    const cRank = classSorted.findIndex(s => s.total === dataObj.grandTotal) + 1;
                    dataObj.schoolRank = sRank;
                    dataObj.classRank = cRank;
                }

                const collection = document.getElementById('fbCollection').value.trim() || 'marksheets';
                const docRef = db.collection(collection).doc(admNo.toString());
                await docRef.set(dataObj, { merge: true });

                showToast(`✅ Saved ${dataObj.name} (Adm: ${admNo}) to Firestore.`, 'success');
            } catch (err) {
                console.error('Firestore save error:', err);
                showToast(`❌ Save failed: ${err.message}`, 'error');
            }

            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '☁️ Save';
            }
        }

        async function saveAllToFirestore() {
            const btn = document.getElementById('saveAllBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Saving All...';

            try {
                const db = getDb();
                if (!db) {
                    showToast('❌ Firebase not initialized. Check config.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '☁️ Save All to Firestore';
                    return;
                }

                if (allStudentsData.length === 0) {
                    showToast('No student data to save.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '☁️ Save All to Firestore';
                    return;
                }

                const collection = document.getElementById('fbCollection').value.trim() || 'marksheets';
                let successCount = 0;
                let failCount = 0;

                // Build all data objects with ranks
                const studentsWithTotals = allStudentsData.map(row => ({
                    row: row,
                    total: (Number(row[17]) || 0) + (Number(row[27]) || 0) + (Number(row[37]) || 0) + (Number(row[47]) || 0) + (
                        Number(row[57]) || 0),
                    class: row[2] || ''
                }));
                const schoolSorted = [...studentsWithTotals].sort((a, b) => b.total - a.total);

                for (let i = 0; i < allStudentsData.length; i++) {
                    const row = allStudentsData[i];
                    const admNo = row[0] || '000';
                    const dataObj = buildStudentData(row);
                    const sRank = schoolSorted.findIndex(s => s.total === dataObj.grandTotal) + 1;
                    const classStudents = studentsWithTotals.filter(s => s.class === dataObj.class);
                    const classSorted = [...classStudents].sort((a, b) => b.total - a.total);
                    const cRank = classSorted.findIndex(s => s.total === dataObj.grandTotal) + 1;
                    dataObj.schoolRank = sRank;
                    dataObj.classRank = cRank;

                    try {
                        const docRef = db.collection(collection).doc(admNo.toString());
                        await docRef.set(dataObj, { merge: true });
                        successCount++;
                    } catch (e) {
                        failCount++;
                        console.warn(`Failed to save ${admNo}:`, e);
                    }
                }

                if (failCount === 0) {
                    showToast(`✅ All ${successCount} students saved to Firestore!`, 'success');
                } else {
                    showToast(`⚠️ Saved ${successCount}, failed ${failCount}. Check console.`, 'error');
                }
            } catch (err) {
                console.error('Firestore batch save error:', err);
                showToast(`❌ Batch save failed: ${err.message}`, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '☁️ Save All to Firestore';
        }

        // ============================================================
        // 11. TOGGLE FIRESTORE CONFIG
        // ============================================================
        function toggleFirestoreConfig() {
            const area = document.getElementById('firestoreConfigArea');
            if (area.style.display === 'none') {
                area.style.display = '';
            } else {
                area.style.display = 'none';
            }
        }

        // ============================================================
        // 12. INIT
        // ============================================================
        // Try to init Firebase on load
        document.addEventListener('DOMContentLoaded', function() {
            try {
                initFirebase();
            } catch (e) {
                console.warn('Firebase init on load skipped:', e);
            }
            // Show config area by default
            document.getElementById('firestoreConfigArea').style.display = '';
        });

        // Expose functions globally
        window.downloadIndividual = downloadIndividual;
        window.saveSingleToFirestore = saveSingleToFirestore;
        window.saveAllToFirestore = saveAllToFirestore;
        window.toggleFirestoreConfig = toggleFirestoreConfig;
        window.uploadPhoto = uploadPhoto;
        window.generateAllMarksheets = generateAllMarksheets;
        window.renderStudentList = renderStudentList;
    </script>
