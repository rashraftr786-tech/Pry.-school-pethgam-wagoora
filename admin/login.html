<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | GPS Pethgam Wagoora</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      font-family: Arial, sans-serif;

      background: #f2f2f2;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      padding: 20px;

    }

    .login-box {

      background: #fff;

      padding: 30px;

      width: 100%;

      max-width: 360px;

      border-radius: 10px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.20);

    }

    h2 {

      text-align: center;

      color: darkgreen;

      margin-top: 0;

      margin-bottom: 8px;

    }

    .school-name {

      text-align: center;

      font-size: 13px;

      color: #555;

      margin-bottom: 25px;

    }

    label {

      display: block;

      font-weight: bold;

      font-size: 13px;

      margin-bottom: 5px;

      color: #333;

    }

    input {

      width: 100%;

      padding: 12px;

      margin-bottom: 15px;

      border: 1px solid #ccc;

      border-radius: 5px;

      font-size: 15px;

    }

    input:focus {

      outline: none;

      border-color: darkgreen;

      box-shadow:
        0 0 4px rgba(0,100,0,0.25);

    }

    button {

      width: 100%;

      padding: 12px;

      background: darkgreen;

      color: white;

      border: none;

      border-radius: 5px;

      cursor: pointer;

      font-size: 16px;

      font-weight: bold;

    }

    button:hover {

      background: #004d00;

    }

    button:disabled {

      background: #777;

      cursor: not-allowed;

    }

    .error {

      color: #c62828;

      background: #ffebee;

      border: 1px solid #ef9a9a;

      font-size: 13px;

      text-align: center;

      margin-top: 15px;

      padding: 10px;

      border-radius: 5px;

      display: none;

      line-height: 1.4;

    }

    .info {

      color: #0d47a1;

      background: #e3f2fd;

      border: 1px solid #90caf9;

      font-size: 13px;

      text-align: center;

      margin-top: 15px;

      padding: 10px;

      border-radius: 5px;

      display: none;

    }

    .login-type {

      text-align: center;

      font-size: 12px;

      color: #666;

      margin-top: 20px;

    }

  </style>

</head>


<body>


<div class="login-box">

  <h2>Login</h2>

  <div class="school-name">

    Government Primary School<br>

    Pethgam Wagoora

  </div>


  <form id="loginForm">


    <label for="email">
      Email ID
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter Email ID"
      autocomplete="username"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      autocomplete="current-password"
      required
    >


    <button
      type="submit"
      id="loginButton"
    >
      Login
    </button>


    <div
      id="error"
      class="error">
    </div>


    <div
      id="info"
      class="info">
    </div>


  </form>


  <div class="login-type">

    Admin and Teacher Login

  </div>


</div>



<!-- =====================================================
     FIREBASE LOGIN
     ===================================================== -->

<script type="module">


  /*
   * IMPORTANT
   *
   * This file is:
   *
   * admin/index.html
   *
   * Firebase initialization is:
   *
   * assets/js/init-firebase.js
   *
   * Therefore:
   *
   * ../assets/js/init-firebase.js
   */


  import { auth, db }
    from "../assets/js/init-firebase.js";


  import {
    signInWithEmailAndPassword,
    signOut
  }
  from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


  import {
    doc,
    getDoc
  }
  from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



  /* =====================================================
     ELEMENTS
     ===================================================== */

  const loginForm =
    document.getElementById("loginForm");


  const loginButton =
    document.getElementById("loginButton");


  const errorElement =
    document.getElementById("error");


  const infoElement =
    document.getElementById("info");



  /* =====================================================
     MESSAGE FUNCTIONS
     ===================================================== */

  function showError(message) {

    errorElement.textContent =
      message;

    errorElement.style.display =
      "block";

    infoElement.style.display =
      "none";

  }


  function showInfo(message) {

    infoElement.textContent =
      message;

    infoElement.style.display =
      "block";

    errorElement.style.display =
      "none";

  }


  function clearMessages() {

    errorElement.textContent = "";

    infoElement.textContent = "";

    errorElement.style.display =
      "none";

    infoElement.style.display =
      "none";

  }



  /* =====================================================
     LOGIN
     ===================================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      clearMessages();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;



      if (!email || !password) {

        showError(
          "Please enter your email and password."
        );

        return;

      }



      loginButton.disabled =
        true;


      loginButton.textContent =
        "Signing in...";


      try {


        /* =================================================
           STEP 1
           CHECK OLD ADMIN / HOI LOGIN
           ================================================= */


        if (
          email === "pspethgam@gmail.com" &&
          password === "admin@123"
        ) {

          localStorage.setItem(
            "userRole",
            "HOI"
          );

          localStorage.setItem(
            "loginEmail",
            email
          );


          showInfo(
            "Admin login successful. Opening Admin Dashboard..."
          );


          window.location.href =
            "dashboard.html";


          return;

        }



        /* =================================================
           STEP 2
           CHECK OLD INCHARGE LOGIN
           ================================================= */


        if (
          email === "pspethgam@gmail.com" &&
          password === "incharge@123"
        ) {

          localStorage.setItem(
            "userRole",
            "INCHARGE"
          );

          localStorage.setItem(
            "loginEmail",
            email
          );


          showInfo(
            "Incharge login successful. Opening Admin Dashboard..."
          );


          window.location.href =
            "dashboard.html";


          return;

        }



        /* =================================================
           STEP 3
           FIREBASE AUTHENTICATION
           FOR TEACHERS / STAFF
           ================================================= */


        showInfo(
          "Checking teacher account..."
        );


        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        console.log(
          "Firebase user:",
          user.uid
        );


        /* =================================================
           STEP 4
           FIND STAFF RECORD
           =================================================

           IMPORTANT:

           The Staff Entry system must save the
           staff record using the Firebase Auth UID:

           staffRecords/{UID}

        */


        const staffRef =
          doc(
            db,
            "staffRecords",
            user.uid
          );


        const staffSnapshot =
          await getDoc(
            staffRef
          );



        if (!staffSnapshot.exists()) {


          await signOut(auth);


          showError(
            "Teacher account exists in Firebase Authentication, but no matching record was found in staffRecords."
          );


          return;

        }



        /* =================================================
           STEP 5
           READ STAFF DATA
           ================================================= */


        const staffData =
          staffSnapshot.data();


        console.log(
          "Staff data:",
          staffData
        );


        const role =
          String(
            staffData.role || ""
          )
          .trim()
          .toLowerCase();



        /* =================================================
           STEP 6
           CHECK ACCOUNT STATUS
           ================================================= */


        const status =
          String(
            staffData.status || "active"
          )
          .trim()
          .toLowerCase();


        if (
          status === "inactive" ||
          status === "disabled"
        ) {


          await signOut(auth);


          showError(
            "Your staff account is currently inactive. Please contact the Headmaster."
          );


          return;

        }



        /* =================================================
           STEP 7
           SAVE LOGIN INFORMATION
           ================================================= */


        localStorage.setItem(
          "userRole",
          role
        );


        localStorage.setItem(
          "loginEmail",
          user.email || email
        );


        localStorage.setItem(
          "staffUID",
          user.uid
        );


        localStorage.setItem(
          "staffName",
          staffData.name || ""
        );


        localStorage.setItem(
          "staffDesignation",
          staffData.designation || ""
        );



        /* =================================================
           STEP 8
           TEACHER → TEACHER DASHBOARD
           ================================================= */


        if (
          role === "teacher" ||
          role === "staff"
        ) {


          showInfo(
            "Teacher login successful. Opening Teacher Dashboard..."
          );


          /*
           * Login page is inside admin/
           *
           * Teacher dashboard is:
           *
           * teacher/dashboard.html
           *
           * Therefore:
           *
           * ../teacher/dashboard.html
           */


          window.location.href =
            "../teacher/dashboard.html";


          return;

        }



        /* =================================================
           STEP 9
           HEADMASTER / ADMIN
           ================================================= */


        if (
          role === "admin" ||
          role === "headmaster" ||
          role === "hoi" ||
          role === "incharge"
        ) {


          showInfo(
            "Admin login successful. Opening Admin Dashboard..."
          );


          window.location.href =
            "dashboard.html";


          return;

        }



        /* =================================================
           UNKNOWN ROLE
           ================================================= */


        await signOut(auth);


        localStorage.removeItem(
          "userRole"
        );


        localStorage.removeItem(
          "staffUID"
        );


        showError(
          "Login successful, but the account role is not recognized.\n\nRole found: " +
          (staffData.role || "Not specified")
        );


      }


      catch(error) {


        console.error(
          "Firebase Login Error:",
          error
        );


        let message =
          "Unable to login.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "Invalid email or password.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No Firebase account exists for this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "Incorrect password.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Too many login attempts. Please try again later.";

        }

        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Network connection failed. Please check your Internet connection.";

        }

        else if (
          error.message
        ) {

          message =
            error.message;

        }


        showError(
          message
        );


      }


      finally {


        loginButton.disabled =
          false;


        loginButton.textContent =
          "Login";

      }

    }
  );


</script>


</body>

</html>
