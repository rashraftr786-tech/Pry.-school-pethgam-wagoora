<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | GPS Pethgam Wagoora</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      font-family: Arial, sans-serif;

      background: #f2f2f2;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      padding: 20px;

    }

    .login-box {

      background: #fff;

      padding: 30px;

      width: 100%;

      max-width: 360px;

      border-radius: 10px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.20);

    }

    h2 {

      text-align: center;

      color: darkgreen;

      margin-top: 0;

      margin-bottom: 8px;

    }

    .school-name {

      text-align: center;

      font-size: 13px;

      color: #555;

      margin-bottom: 25px;

    }

    label {

      display: block;

      font-weight: bold;

      font-size: 13px;

      margin-bottom: 5px;

      color: #333;

    }

    input {

      width: 100%;

      padding: 12px;

      margin-bottom: 15px;

      border: 1px solid #ccc;

      border-radius: 5px;

      font-size: 15px;

    }

    input:focus {

      outline: none;

      border-color: darkgreen;

      box-shadow:
        0 0 4px rgba(0,100,0,0.25);

    }

    button {

      width: 100%;

      padding: 12px;

      background: darkgreen;

      color: white;

      border: none;

      border-radius: 5px;

      cursor: pointer;

      font-size: 16px;

      font-weight: bold;

    }

    button:hover {

      background: #004d00;

    }

    button:disabled {

      background: #777;

      cursor: not-allowed;

    }

    .error {

      color: #c62828;

      background: #ffebee;

      border: 1px solid #ef9a9a;

      font-size: 13px;

      text-align: center;

      margin-top: 15px;

      padding: 10px;

      border-radius: 5px;

      display: none;

      line-height: 1.4;

    }

    .info {

      color: #0d47a1;

      background: #e3f2fd;

      border: 1px solid #90caf9;

      font-size: 13px;

      text-align: center;

      margin-top: 15px;

      padding: 10px;

      border-radius: 5px;

      display: none;

    }

    .login-type {

      text-align: center;

      font-size: 12px;

      color: #666;

      margin-top: 20px;

    }

  </style>

</head>


<body>


<div class="login-box">

  <h2>Login</h2>

  <div class="school-name">

    Government Primary School<br>

    Pethgam Wagoora

  </div>


  <form id="loginForm">


    <label for="email">
      Email ID
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter Email ID"
      autocomplete="username"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      autocomplete="current-password"
      required
    >


    <button
      type="submit"
      id="loginButton"
    >
      Login
    </button>


    <div
      id="error"
      class="error">
    </div>


    <div
      id="info"
      class="info">
    </div>


  </form>


  <div class="login-type">

    Admin and Teacher Login

  </div>


</div>



<!-- =====================================================
     FIREBASE LOGIN
     ===================================================== -->

<script type="module">

import { auth, db } from "./assets/js/init-firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const loginForm = document.getElementById("loginForm");
const errorElement = document.getElementById("error");

let selectedRole = "teacher";


/* =========================================================
   ROLE SELECTION
   ========================================================= */

document.querySelectorAll("[data-role]").forEach(button => {

    button.addEventListener("click", function() {

        selectedRole = this.dataset.role;

        console.log("Selected role:", selectedRole);

    });

});


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorElement.textContent = "";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        errorElement.textContent =
            "Please enter email and password.";

        return;
    }


    try {

        console.log("Logging in:", email);

        console.log(
            "Selected role:",
            selectedRole
        );


        /* -------------------------------------------------
           FIREBASE AUTHENTICATION
           ------------------------------------------------- */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "Firebase login successful:",
            user.email
        );


        /* =================================================
           ADMIN
           ================================================= */

        if (selectedRole === "admin") {

            /*
             * Put your actual admin email here.
             */

            const adminEmails = [
                "pspethgam@gmail.com"
            ];


            if (
                !adminEmails
                    .map(e => e.toLowerCase())
                    .includes(user.email.toLowerCase())
            ) {

                await signOut(auth);

                throw new Error(
                    "This account is not authorized for Admin login."
                );
            }


            localStorage.removeItem("userRole");

            localStorage.setItem(
                "userRole",
                "HOI"
            );


            window.location.href =
                "admin/dashboard.html";


            return;
        }


        /* =================================================
           TEACHER
           ================================================= */

        if (selectedRole === "teacher") {

            const staffQuery =
                query(
                    collection(db, "staffRecords"),
                    where("email", "==", user.email)
                );


            const staffSnapshot =
                await getDocs(staffQuery);


            if (staffSnapshot.empty) {

                await signOut(auth);

                throw new Error(
                    "No staff record was found for this account."
                );
            }


            let staffData = null;


            staffSnapshot.forEach(doc => {

                staffData = {
                    id: doc.id,
                    ...doc.data()
                };

            });


            console.log(
                "Staff record:",
                staffData
            );


            /*
             * Only active staff members
             * should enter Teacher Portal.
             */

            if (
                staffData.status &&
                staffData.status !== "active"
            ) {

                await signOut(auth);

                throw new Error(
                    "This staff account is currently inactive."
                );
            }


            /* ------------------------------------------------
               SAVE TEACHER SESSION
               ------------------------------------------------ */

            localStorage.removeItem("userRole");

            localStorage.setItem(
                "userRole",
                "staff"
            );


            localStorage.setItem(
                "staffId",
                staffData.id
            );


            localStorage.setItem(
                "staffName",
                staffData.name || ""
            );


            localStorage.setItem(
                "staffEmail",
                user.email
            );


            /* ------------------------------------------------
               GO TO TEACHER DASHBOARD
               ------------------------------------------------ */

            window.location.href =
                "teacher/dashboard.html";


            return;
        }


        /* =================================================
           STUDENT
           ================================================= */

        if (selectedRole === "student") {

            /*
             * Student routing will be connected
             * to your student collection.
             */

            const studentQuery =
                query(
                    collection(db, "students"),
                    where("email", "==", user.email)
                );


            const studentSnapshot =
                await getDocs(studentQuery);


            if (studentSnapshot.empty) {

                await signOut(auth);

                throw new Error(
                    "No student record was found for this account."
                );
            }


            localStorage.removeItem("userRole");

            localStorage.setItem(
                "userRole",
                "student"
            );


            window.location.href =
                "student/dashboard.html";


            return;
        }


        throw new Error(
            "Please select a valid account type."
        );


    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        errorElement.textContent =
            error.message ||
            "Unable to login.";

    }

});

</script>
</body>
</html>
