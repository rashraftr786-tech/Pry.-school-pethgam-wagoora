<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERP Login | GPS Pethgam Wagoora</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0b1020;
}

.login-box {
    width: 100%;
    max-width: 430px;
    padding: 30px;
    border-radius: 30px;
    background: #171b2d;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    color: white;
}

.logo {
    text-align: center;
    font-size: 42px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 30px;
}

.school {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 25px;
}

.roles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #20263b;
    padding: 5px;
    border-radius: 40px;
    margin-bottom: 25px;
}

.role {
    border: 0;
    background: transparent;
    color: #aaa;
    padding: 13px 5px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.role.active {
    background: #5369c9;
    color: white;
}

label {
    display: block;
    margin: 14px 0 7px;
    font-weight: bold;
    color: #bbb;
}

input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    background: #edf3ff;
}

.login-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 30px;
    background: #5369c9;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 15px;
    text-align: center;
}

.error {
    background: #4b2028;
    color: #ffb4b4;
}

.success {
    background: #163c2b;
    color: #73e6a2;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🏫</div>

    <h1>ERP Portal</h1>

    <div class="school">
        Government Primary School Pethgam Wagoora
    </div>

    <div class="roles">

        <button type="button"
                class="role"
                data-role="admin">
            👨‍💼 Admin
        </button>

        <button type="button"
                class="role active"
                data-role="teacher">
            👨‍🏫 Teacher
        </button>

        <button type="button"
                class="role"
                data-role="student">
            🧑‍🎓 Student
        </button>

    </div>

    <form id="loginForm">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter Email Address"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button
            class="login-btn"
            id="loginButton"
            type="submit">
            Sign In
        </button>

        <div id="error"
             class="message error"></div>

        <div id="success"
             class="message success"></div>

    </form>

</div>


<script type="module">

import { auth, db }
from "./assets/js/init-firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


let selectedRole = "teacher";


const roleButtons =
    document.querySelectorAll(".role");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");


/* ===============================
   ROLE SELECTION
================================ */

roleButtons.forEach(button => {

    button.addEventListener("click", () => {

        roleButtons.forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");

        selectedRole =
            button.dataset.role;

        console.log(
            "Selected role:",
            selectedRole
        );

    });

});


/* ===============================
   LOGIN
================================ */

loginForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        errorBox.style.display = "none";
        successBox.style.display = "none";

        const email =
            document.getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password =
            document.getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing In...";


        try {

            /* =========================
               FIREBASE AUTH
            ========================== */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                credential.user;


            console.log(
                "Authenticated:",
                user.email
            );


            /* =========================
               ADMIN
            ========================== */

            if (selectedRole === "admin") {

                const adminEmails = [
                    "pspethgam@gmail.com"
                ];

                if (
                    !adminEmails.includes(
                        user.email.toLowerCase()
                    )
                ) {

                    await signOut(auth);

                    throw new Error(
                        "This account is not authorized for Admin login."
                    );
                }


                localStorage.clear();

                localStorage.setItem(
                    "userRole",
                    "HOI"
                );

                localStorage.setItem(
                    "userEmail",
                    user.email
                );


                successBox.textContent =
                    "Admin login successful. Opening Admin Dashboard...";

                successBox.style.display =
                    "block";


                setTimeout(() => {

                    window.location.replace(
                        "./admin/dashboard.html"
                    );

                }, 500);

                return;
            }


            /* =========================
               TEACHER
            ========================== */

            if (selectedRole === "teacher") {

                const staffQuery =
                    query(
                        collection(
                            db,
                            "staffRecords"
                        ),
                        where(
                            "email",
                            "==",
                            user.email
                        )
                    );


                const snapshot =
                    await getDocs(staffQuery);


                if (snapshot.empty) {

                    await signOut(auth);

                    throw new Error(
                        "No staff record exists for this email in staffRecords."
                    );
                }


                let staff = null;

                snapshot.forEach(doc => {

                    staff = {
                        id: doc.id,
                        ...doc.data()
                    };

                });


                console.log(
                    "Teacher record:",
                    staff
                );


                if (
                    staff.status &&
                    String(staff.status)
                        .toLowerCase() !== "active"
                ) {

                    await signOut(auth);

                    throw new Error(
                        "This teacher account is inactive."
                    );
                }


                /* =========================
                   SAVE TEACHER SESSION
                ========================== */

                localStorage.clear();

                localStorage.setItem(
                    "userRole",
                    "staff"
                );

                localStorage.setItem(
                    "staffId",
                    staff.id
                );

                localStorage.setItem(
                    "staffName",
                    staff.name || ""
                );

                localStorage.setItem(
                    "staffEmail",
                    user.email
                );


                successBox.textContent =
                    "Teacher login successful. Opening Teacher Dashboard...";

                successBox.style.display =
                    "block";


                setTimeout(() => {

                    window.location.replace(
                        "./teacher/dashboard.html"
                    );

                }, 500);

                return;
            }


            /* =========================
               STUDENT
            ========================== */

            if (selectedRole === "student") {

                const studentQuery =
                    query(
                        collection(
                            db,
                            "students"
                        ),
                        where(
                            "email",
                            "==",
                            user.email
                        )
                    );


                const snapshot =
                    await getDocs(studentQuery);


                if (snapshot.empty) {

                    await signOut(auth);

                    throw new Error(
                        "No student record exists for this email."
                    );
                }


                localStorage.clear();

                localStorage.setItem(
                    "userRole",
                    "student"
                );

                localStorage.setItem(
                    "studentEmail",
                    user.email
                );


                successBox.textContent =
                    "Student login successful. Opening Student Dashboard...";

                successBox.style.display =
                    "block";


                setTimeout(() => {

                    window.location.replace(
                        "./student/dashboard.html"
                    );

                }, 500);

                return;
            }

        }

        catch(error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            errorBox.textContent =
                error.message ||
                "Unable to login.";

            errorBox.style.display =
                "block";

        }

        finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Sign In";

        }

    });

</script>

</body>
</html>
