<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Letter Head</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f2f2f2;
    font-family:"Times New Roman",serif;
}

.page{
    width:210mm;
    min-height:297mm;
    background:#fff;
    margin:15px auto;
    padding:18mm;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #000;
    padding-bottom:8px;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
}

.title{
    flex:1;
    text-align:center;
    line-height:1.35;
}

.title h1{
    margin:0;
    font-size:18px;
    text-transform:uppercase;
}

.title h2{
    margin:3px 0;
    font-size:23px;
    font-weight:bold;
}

.title h3{
    margin:2px 0;
    font-size:16px;
}

.title p{
    margin:2px;
    font-size:14px;
}

.details{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:16px;
}

input{
    border:none;
    border-bottom:1px solid #000;
    font-size:16px;
    font-family:inherit;
    padding:2px;
}

.subject{
    margin-top:18px;
    font-size:17px;
}

.subject input{
    width:82%;
}

textarea{
    width:100%;
    height:450px;
    border:1px solid #999;
    margin-top:15px;
    padding:10px;
    font-size:17px;
    resize:vertical;
    font-family:"Times New Roman",serif;
    line-height:1.6;
}

.signature{
    margin-top:60px;
    text-align:right;
    line-height:1.6;
}

.buttons{
    text-align:center;
    margin:20px;
}

button{
    padding:10px 22px;
    font-size:16px;
    cursor:pointer;
    margin:5px;
}

@media print{

body{
background:#fff;
}

.page{
margin:0;
box-shadow:none;
width:100%;
min-height:auto;
padding:15mm;
}

.buttons{
display:none;
}

input,textarea{
border:none;
outline:none;
}

textarea{
height:auto;
overflow:hidden;
}

}

</style>
</head>

<body>

<div class="buttons">
<button onclick="window.print()">🖨 Print</button>
<button onclick="clearForm()">🗑 Clear</button>
</div>

<div class="page">

<div class="header">

<img src="logo.png" class="logo">

<div class="title">

<h1>Government of Jammu & Kashmir (UT)</h1>

<h2>OFFICE OF THE CHIEF EDUCATION OFFICER BARAMULLA</h2>

<h3>Kanli Bagh Road, Mini Secretariat Baramulla-193101, J&K</h3>

<p>E-mail : ceoplgbla@gmail.com</p>

</div>

<img src="logo.png" class="logo">

</div>

<div class="details">

<div>
<strong>Ref. No.</strong>

<input type="text" style="width:220px;">
</div>

<div>
<strong>Date</strong>

<input type="date">
</div>

</div>

<div class="subject">

<strong>Subject :</strong>

<input type="text" placeholder="Enter Subject">

</div>

<textarea placeholder="Type your letter here..."></textarea>

<div class="signature">

<strong>Yours faithfully</strong>

<br><br><br>

<b>Chief Education Officer</b>

<br>

<b>Baramulla</b>

</div>

</div>

<script>

function clearForm(){

document.querySelectorAll("input").forEach(i=>i.value="");

document.querySelector("textarea").value="";

}

</script>

</body>
</html>
