<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct SMS | GPS Pethgam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
        <h2 class="text-xl font-black mb-6 text-blue-600"><i class="fas fa-comment-alt"></i> Send Direct SMS</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Select Student</label>
                <select id="studentSelect" class="w-full p-4 rounded-2xl border bg-slate-50 font-bold outline-none">
                    <option value="">-- Choose Student --</option>
                </select>
            </div>

            <textarea id="msgBody" rows="5" class="w-full p-4 rounded-2xl border bg-slate-50 font-bold text-sm outline-none" placeholder="Type your SMS here..."></textarea>

            <!-- ===== BUTTON NOW CLEARLY LABELED ===== -->
            <button onclick="sendSMS()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl shadow-lg transition text-lg flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> Send SMS
            </button>

            <a href="index.html" class="block text-center text-xs font-bold text-slate-400 mt-4 uppercase">Back to Dashboard</a>
        </div>
    </div>

    <script type="module">
  let students = [];

  // Try to load from Firebase, but fallback gracefully
  try {
    const { db } = await import('./init-firebase.js');
    const { collection, getDocs, addDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
    const snap = await getDocs(collection(db, "admissions"));
    const select = document.getElementById('studentSelect');
    snap.forEach(doc => {
      const s = doc.data();
      const fullName = [s.sFirstName, s.sMiddleName, s.sLastName].filter(Boolean).join(' ').trim() || 'Unknown';
      const opt = document.createElement('option');
      opt.value = s.fatherContact || '';
      opt.dataset.name = fullName;
      opt.textContent = `${fullName} (${s.fatherContact || 'No Phone'})`;
      select.appendChild(opt);
    });
    // Store the db and addDoc for later use
    window.__firebase = { db, addDoc };
  } catch (err) {
    console.warn("Firebase not loaded – SMS will open without logging.", err);
    // Optionally show a message to the user
    document.querySelector('.max-w-md').insertAdjacentHTML('beforeend', 
      `<div class="bg-yellow-100 text-yellow-800 p-2 rounded mt-2 text-xs">⚠️ SMS will be sent but NOT logged to Firebase (init-firebase.js missing).</div>`
    );
  }

  window.sendSMS = async function() {
    const select = document.getElementById('studentSelect');
    const phone = select.value;
    const msg = document.getElementById('msgBody').value;
    const name = select.selectedOptions[0]?.dataset.name || 'Unknown';

    if (!phone || !msg) return alert("Select student and enter message");

    // If Firebase is available, log the SMS
    if (window.__firebase) {
      try {
        const { db, addDoc } = window.__firebase;
        const { collection } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
        await addDoc(collection(db, "comm_logs"), {
          recipient: name,
          phone: phone,
          message: msg,
          type: "SMS",
          date: new Date().toLocaleDateString('en-GB'),
          timestamp: new Date()
        });
      } catch (e) {
        console.warn("Failed to log SMS:", e);
      }
    }

    // Open native SMS app
    window.location.href = `sms:+91${phone}?body=${encodeURIComponent(msg)}`;
  };
    </script>
</body>
</html>
