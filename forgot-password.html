<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Reset Password | GPS Pethgam Wagoora</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#f0fdfa 55%,#ffedd5);font-family:Arial,sans-serif;color:#172033}
    .card{width:min(100%,440px);background:#fff;border:1px solid #dbeafe;border-radius:26px;padding:30px;box-shadow:0 22px 65px #17335b24}
    .icon{width:66px;height:66px;margin:0 auto 16px;display:grid;place-items:center;border-radius:22px;background:#ffedd5;color:#c2410c;font-size:30px}
    h1{text-align:center;margin:0;font-size:25px;color:#172554}.sub{text-align:center;color:#64748b;font-size:13px;line-height:1.55;margin:9px 0 25px}
    label{display:block;font-size:12px;font-weight:800;color:#334155;margin:0 0 8px}input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;background:#f8fafc;font-size:16px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb20}
    button{width:100%;border:0;border-radius:13px;background:#1e3a8a;color:#fff;padding:15px;font-size:14px;font-weight:800;cursor:pointer;margin-top:16px}button:disabled{opacity:.65;cursor:wait}
    #message{display:none;margin-top:16px;padding:13px;border-radius:12px;font-size:13px;line-height:1.5}#message.success{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}#message.error{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    .back{display:block;text-align:center;margin-top:22px;color:#64748b;text-decoration:none;font-size:12px;font-weight:800}.back:hover{color:#ea580c}.hint{font-size:11px;color:#64748b;line-height:1.5;margin-top:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🔐</div>
    <h1>Reset Your Password</h1>
    <p class="sub">Enter the email address registered with your school ERP account. Firebase will send you a secure password-reset link.</p>
    <form id="resetForm">
      <label for="email">REGISTERED EMAIL ADDRESS</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your registered email" required>
      <button id="sendBtn" type="submit">SEND RESET LINK</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="hint">If the email does not arrive, check your spam folder and confirm that you entered the email used for your ERP login.</p>
    <a class="back" href="signin.html">← BACK TO LOGIN</a>
  </main>
  <script type="module">
    import { auth } from './assets/js/init-firebase.js';
    import { sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const button = document.getElementById('sendBtn');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) {
        showMessage('Please enter your registered email address.', 'error');
        emailInput.focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'SENDING RESET LINK…';
      message.className = '';
      message.textContent = '';
      try {
        await sendPasswordResetEmail(auth, email);
        showMessage('If an ERP account exists for this email, a password-reset link has been sent. Please check your inbox and spam folder.', 'success');
        button.textContent = 'RESET LINK SENT';
      } catch (error) {
        console.error('Password reset error:', error);
        let text = 'Unable to send the reset email right now. Please try again or contact the school administrator.';
        if (error.code === 'auth/invalid-email') text = 'Please enter a valid email address.';
        else if (error.code === 'auth/too-many-requests') text = 'Too many attempts. Please wait a while before trying again.';
        else if (error.code === 'auth/network-request-failed') text = 'Network error. Check your internet connection and try again.';
        else if (error.code === 'auth/unauthorized-continue-uri' || error.code === 'auth/operation-not-allowed') text = 'Password reset is not enabled or this website domain is not authorized in Firebase Authentication. Please contact the administrator.';
        showMessage(text, 'error');
        button.disabled = false;
        button.textContent = 'TRY AGAIN';
      }
    });
  </script>
</body>
</html>
