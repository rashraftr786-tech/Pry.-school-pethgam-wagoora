<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Stopwatch</title>
  <style>
    :root{
      --bg1:#151b2b;
      --bg2:#0d1220;
      --panel:#2a3143;
      --panel2:#232a3a;
      --text:#f7d58a;
      --gold:#f3bc55;
      --gold2:#ffd86f;
      --shadow:#00000088;
      --blue:#6e88c7;
      --blue2:#34508f;
      --border:#f2c25d;
      --green:#62e6a8;
      --red:#ff7c7c;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top, #27314c 0%, transparent 35%),
        radial-gradient(circle at bottom, #1a2238 0%, #0a0d16 70%);
      overflow:hidden;
      color:#fff;
    }

    .wrap{
      width:min(92vw, 560px);
      padding:18px;
      border-radius:34px;
      position:relative;
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      box-shadow:
        0 0 0 2px rgba(255,204,90,.35),
        0 20px 40px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
    }

    .wrap::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:36px;
      padding:2px;
      background:linear-gradient(135deg, rgba(120,160,255,.55), rgba(255,214,122,.95));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
              mask-composite:exclude;
      filter:blur(.2px);
      pointer-events:none;
    }

    .panel{
      position:relative;
      border-radius:28px;
      padding:28px 22px 22px;
      background:linear-gradient(180deg, #30384c 0%, #242b3a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -18px 30px rgba(0,0,0,.3),
        0 12px 24px rgba(0,0,0,.35);
      overflow:hidden;
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,220,140,.14), transparent 36%),
        radial-gradient(circle at 100% 10%, rgba(255,200,90,.06), transparent 20%);
      pointer-events:none;
    }

    .title{
      text-align:center;
      font-weight:800;
      letter-spacing:2px;
      font-size:clamp(1.4rem, 3vw, 2rem);
      color:#e7c98a;
      text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(255,205,100,.18);
      margin-bottom:20px;
    }

    .mode{
      width:max-content;
      margin:0 auto 18px;
      padding:10px 18px;
      border-radius:16px;
      background:linear-gradient(180deg, #38435a, #232a3c);
      color:#f7d58a;
      font-weight:800;
      font-size:1rem;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 8px 18px rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.07);
    }

    .mode .dot{
      width:14px;height:14px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #fff7c8 0 20%, #ffd15a 35%, #ffb400 100%);
      box-shadow:0 0 12px rgba(255,198,70,.85);
      animation:pulse 1.4s ease-in-out infinite;
    }

    .time{
      text-align:center;
      font-variant-numeric:tabular-nums;
      font-size:clamp(3.2rem, 11vw, 6.2rem);
      line-height:1;
      font-weight:900;
      letter-spacing:.06em;
      color:var(--text);
      text-shadow:
        0 0 3px rgba(255,218,140,.7),
        0 0 12px rgba(255,180,70,.35),
        0 6px 16px rgba(0,0,0,.5);
      margin:10px 0 20px;
      filter:drop-shadow(0 0 8px rgba(255,194,74,.12));
    }

    .time span{
      display:inline-block;
      min-width: .75em;
      animation:digitPop .22s ease;
    }

    .progressRow{
      display:flex;
      align-items:center;
      gap:14px;
      margin:8px 0 14px;
      padding:10px 12px;
      border-radius:18px;
      background:linear-gradient(180deg, #283149, #1f2636);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.05);
    }

    .ring{
      --p:0;
      width:58px;height:58px;border-radius:50%;
      background:
        conic-gradient(var(--gold2) calc(var(--p) * 1%), #4a5b86 0);
      position:relative;
      flex:none;
      box-shadow:0 0 0 4px rgba(255,255,255,.03), inset 0 0 14px rgba(0,0,0,.4);
      transition:background .25s ease;
    }
    .ring::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:50%;
      background:linear-gradient(180deg, #303a53, #232b3b);
      box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
    }
    .ring::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.06);
    }

    .rounds{
      flex:1;
      font-size:1.1rem;
      color:#8eb0ef;
      text-shadow:0 1px 0 rgba(0,0,0,.45);
      line-height:1.35;
    }
    .rounds strong{color:#ffd86f}

    .status{
      text-align:center;
      color:#ffbf63;
      font-size:clamp(1.05rem, 2.8vw, 1.45rem);
      font-weight:900;
      margin:10px 0 18px;
      text-shadow:0 2px 10px rgba(255,171,66,.25);
      min-height:3rem;
    }

    .status small{
      display:block;
      font-size:.9em;
      color:#ffcf88;
      opacity:.95;
    }

    .buttons{
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .buttons{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:10px;
}

button{
  border:none;
  /* REDUCED BY 20%: 16px -> 12.8px, 28px -> 22.4px */
  padding:12.8px 22.4px; 
  /* REDUCED BY 20%: 22px -> 17.6px */
  border-radius:17.6px;
  /* REDUCED BY 20%: 1.1rem -> 0.88rem */
  font-size:0.88rem;
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  position:relative;
  overflow:hidden;
  /* REDUCED BY 20%: 160px -> 128px */
  min-width:128px;
}

button::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.45), transparent 35%, transparent 65%, rgba(255,255,255,.18));
  opacity:.35;
  mix-blend-mode:screen;
}

.start{
  color:#4c3000;
  background:linear-gradient(180deg, #ffe49b, #f3bb50 55%, #b97a18);
  /* REDUCED SHADOW VALUES BY 20% to maintain the 3D aspect ratio */
  box-shadow:
    0 8px 0 #8b5812,                /* 10px -> 8px */
    0 14.4px 22.4px rgba(0,0,0,.35), /* 18px -> 14.4px, 28px -> 22.4px */
    inset 0 1.6px 0 rgba(255,255,255,.45), /* 2px -> 1.6px */
    inset 0 -6.4px 14.4px rgba(95,40,0,.15); /* -8px -> -6.4px, 18px -> 14.4px */
}

    .reset{
      color:#4d4230;
      background:linear-gradient(180deg, #e0c98c, #c2ab67 55%, #9b8551);
      box-shadow:
        0 10px 0 #665639,
        0 18px 28px rgba(0,0,0,.35),
        inset 0 2px 0 rgba(255,255,255,.35),
        inset 0 -8px 18px rgba(76,45,0,.12);
    }

    button:hover{transform:translateY(-2px) scale(1.01);filter:brightness(1.04)}
    button:active{transform:translateY(6px) scale(.99);box-shadow:none}

    .controls{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:10px;
      margin-bottom:2px;
    }

    .field{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(50,64,96,.35);
      border:1px solid rgba(125,156,220,.22);
      color:#a7b5dd;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
      font-size:.98rem;
    }

    .field input{
      width:72px;
      border:none;
      outline:none;
      border-radius:8px;
      padding:6px 8px;
      background:#1c2538;
      color:#f7d58a;
      font-weight:800;
      text-align:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }

    .keys{
      display:flex;
      justify-content:center;
      margin-top:18px;
      color:#a7b5dd;
      font-size:.98rem;
      opacity:.92;
      text-align:center;
    }

    .credit{
      padding:6px 10px;
      border-radius:10px;
      background:rgba(50,64,96,.35);
      border:1px solid rgba(125,156,220,.22);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }

    .glow{
      position:absolute;
      inset:auto 18px 10px 18px;
      height:8px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,216,111,.65), transparent 70%);
      filter:blur(6px);
      opacity:.7;
      pointer-events:none;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(.82);opacity:.7}
    }

    @keyframes digitPop{
      0%{transform:translateY(4px) scale(.96); opacity:.75}
      100%{transform:translateY(0) scale(1); opacity:1}
    }

    @media (max-width:480px){
      .panel{padding:22px 14px}
      .progressRow{gap:10px}
      .rounds{font-size:1rem}
      button{min-width:140px;padding:15px 22px}
      .controls{flex-direction:column;align-items:center}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">ROUND TIMER</div>

      <div class="mode"><span class="dot"></span> WORK INTERVAL</div>

      <div class="time" id="time">00:15.00</div>

      <div class="controls">
        <label class="field">
          Max Rounds
          <input type="number" id="maxRoundsInput" min="1" value="50" />
        </label>
      </div>

      <div class="progressRow">
        <div class="ring" id="ring" style="--p:0;"></div>
        <div class="rounds" id="rounds">Rounds Completed: <strong>0 of 50</strong></div>
      </div>

      <div class="status" id="status">
        ● ROUND COMPLETE!
        <small>Press START Again</small>
      </div>

      <div class="buttons">
        <button class="start" id="startBtn">▶ START</button>
        <button class="reset" id="resetBtn">↻ RESET</button>
      </div>

      <div class="keys">
        <div class="credit">designed and generated by Mohammad Ashraf Rather</div>
      </div>

      <div class="glow"></div>
    </div>
  </div>

  <script>
    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');
    const roundsEl = document.getElementById('rounds');
    const ringEl = document.getElementById('ring');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const maxRoundsInput = document.getElementById('maxRoundsInput');

    let total = 15 * 1000;
    let remaining = total;
    let running = false;
    let last = 0;
    let rounds = 0;
    let maxRounds = parseInt(maxRoundsInput.value, 10) || 18;
    let raf = null;

    function fmt(ms){
      const centis = Math.max(0, Math.ceil(ms / 10));
      const m = String(Math.floor(centis / 6000)).padStart(2,'0');
      const s = String(Math.floor((centis % 6000) / 100)).padStart(2,'0');
      const c = String(centis % 100).padStart(2,'0');
      return `${m}:${s}.${c}`;
    }

    function render(){
      timeEl.textContent = fmt(remaining);
      const p = Math.min(100, Math.max(0, 100 - (remaining / total) * 100));
      ringEl.style.setProperty('--p', p);
      roundsEl.innerHTML = `Rounds Completed: <strong>${rounds} of ${maxRounds}</strong>`;
      statusEl.innerHTML = running
        ? '● TIMER RUNNING!<small>Press START to Pause</small>'
        : remaining <= 0
          ? '● ROUND COMPLETE!<small>Press START Again</small>'
          : '● PAUSED<small>Press START to Resume</small>';
    }

    function tick(ts){
      if(!running) return;
      if(!last) last = ts;
      const delta = ts - last;
      last = ts;
      remaining -= delta;
      if(remaining <= 0){
        remaining = 0;
        running = false;
        rounds = Math.min(maxRounds, rounds + 1);
        render();
        startBtn.textContent = '▶ START';
        return;
      }
      render();
      raf = requestAnimationFrame(tick);
    }

    function startPause(){
      maxRounds = Math.max(1, parseInt(maxRoundsInput.value, 10) || 18);
      if(remaining <= 0) remaining = total;
      running = !running;
      startBtn.textContent = running ? '⏸ PAUSE' : '▶ START';
      last = 0;
      render();
      cancelAnimationFrame(raf);
      if(running) raf = requestAnimationFrame(tick);
    }

    function reset(){
      maxRounds = Math.max(1, parseInt(maxRoundsInput.value, 10) || 18);
      running = false;
      remaining = total;
      rounds = 0;
      startBtn.textContent = '▶ START';
      last = 0;
      cancelAnimationFrame(raf);
      render();
    }

    maxRoundsInput.addEventListener('change', () => {
      maxRounds = Math.max(1, parseInt(maxRoundsInput.value, 10) || 18);
      if(rounds > maxRounds) rounds = maxRounds;
      render();
    });

    startBtn.addEventListener('click', startPause);
    resetBtn.addEventListener('click', reset);

    window.addEventListener('keydown', (e) => {
      if(e.code === 'Space'){
        e.preventDefault();
        startPause();
      }
      if(e.key.toLowerCase() === 'r') reset();
    });

    render();
  </script>
</body>
</html>
