<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Timer · 15‑Second Interval</title>
    <style>
        /* ───────────────────────────────────────────────
                   RESET & BASE
                ─────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0e1a;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            overflow: hidden;
            padding: 1rem;
        }

        /* ─── Animated Background Orbs ─── */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: orbFloat 22s ease-in-out infinite alternate;
        }

        .bg-orbs .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -15%;
            right: -10%;
            background: radial-gradient(circle, #6c8cff, #3a5bd1);
            animation-duration: 24s;
            opacity: 0.30;
        }

        .bg-orbs .orb:nth-child(2) {
            width: 450px;
            height: 450px;
            bottom: -15%;
            left: -10%;
            background: radial-gradient(circle, #f093fb, #f5576c);
            animation-duration: 28s;
            animation-delay: -4s;
            opacity: 0.20;
        }

        .bg-orbs .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, #4facfe, #00f2fe);
            animation-duration: 20s;
            animation-delay: -8s;
            opacity: 0.16;
        }

        .bg-orbs .orb:nth-child(4) {
            width: 250px;
            height: 250px;
            bottom: 25%;
            right: 20%;
            background: radial-gradient(circle, #f5d742, #f59e42);
            animation-duration: 18s;
            animation-delay: -12s;
            opacity: 0.12;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(40px, -50px) scale(1.10) rotate(5deg);
            }
            66% {
                transform: translate(-30px, 40px) scale(0.92) rotate(-3deg);
            }
            100% {
                transform: translate(20px, -30px) scale(1.06) rotate(4deg);
            }
        }

        /* ───────────────────────────────────────────────
                   CARD – clean glass-morphism
                ─────────────────────────────────────────────── */
        .stopwatch {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            padding: 2.6rem 2.8rem 2.8rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 30px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            min-width: 380px;
            max-width: 480px;
            width: 100%;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
            animation: cardEntry 0.9s ease both;
        }

        .stopwatch:hover {
            border-color: rgba(255, 255, 255, 0.10);
            box-shadow:
                0 40px 90px -16px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ─── Glow Ring ─── */
        .stopwatch::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 3rem;
            padding: 2px;
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(108, 140, 255, 0.10),
                    rgba(245, 215, 66, 0.05),
                    transparent 70%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: spinGlow 16s linear infinite;
        }

        @keyframes spinGlow {
            to {
                transform: rotate(360deg);
            }
        }

        .stopwatch.round-complete::before {
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(245, 215, 66, 0.20),
                    rgba(255, 215, 0, 0.08),
                    transparent 70%);
        }

        .stopwatch.round-complete {
            border-color: rgba(245, 215, 66, 0.10);
            box-shadow:
                0 30px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(245, 215, 66, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 60px rgba(245, 215, 66, 0.02);
        }

        /* ───────────────────────────────────────────────
                   TITLE: ROUND TIMER
                ─────────────────────────────────────────────── */
        .header-title {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.20);
            margin-bottom: 0.4rem;
        }

        /* ───────────────────────────────────────────────
                   WORK INTERVAL
                ─────────────────────────────────────────────── */
        .interval-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 0.1rem;
        }

        /* ───────────────────────────────────────────────
                   TIME DISPLAY
                ─────────────────────────────────────────────── */
        .display {
            font-size: 6.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
            padding: 0.05rem 0;
            line-height: 1.05;
            transition: all 0.4s ease;
            font-family: 'Courier New', 'Fira Code', monospace;
            color: #e8edf5;
            text-shadow: 0 0 40px rgba(100, 180, 255, 0.06);
        }

        .display .sec,
        .display .cent {
            transition: all 0.4s ease;
        }

        .display .colon {
            color: rgba(255, 255, 255, 0.10);
            margin: 0 0.05em;
        }

        .display.running .sec {
            color: #7fc4ff;
        }
        .display.running .cent {
            color: #4a9eff;
        }

        .display.complete .sec {
            color: #f5d742;
            animation: goldPulse 1.2s ease-in-out infinite;
        }
        .display.complete .cent {
            color: #d4b82a;
            animation: goldPulse 1.2s ease-in-out infinite 0.1s;
        }

        @keyframes goldPulse {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(245, 215, 66, 0.08);
            }
            50% {
                text-shadow: 0 0 50px rgba(245, 215, 66, 0.20);
            }
        }

        .display.running {
            text-shadow: 0 0 40px rgba(74, 158, 255, 0.08);
        }

        /* ───────────────────────────────────────────────
                   ROUNDS COMPLETED
                ─────────────────────────────────────────────── */
        .rounds-display {
            margin-top: 0.3rem;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.25);
        }

        .rounds-display .count {
            color: #b0c7e0;
            font-weight: 700;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.05rem 0.8rem;
            border-radius: 16px;
            display: inline-block;
            min-width: 2.2rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .rounds-display .count.pop {
            animation: countPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes countPop {
            0% {
                transform: scale(1);
                color: #f5d742;
                background: rgba(245, 215, 66, 0.10);
                border-color: rgba(245, 215, 66, 0.12);
            }
            50% {
                transform: scale(1.35);
                color: #ffd700;
                background: rgba(245, 215, 66, 0.15);
                border-color: rgba(245, 215, 66, 0.18);
            }
            100% {
                transform: scale(1);
                color: #b0c7e0;
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.03);
            }
        }

        .rounds-display .total {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ───────────────────────────────────────────────
                   STATUS AREA
                ─────────────────────────────────────────────── */
        .status-area {
            margin-top: 0.6rem;
            min-height: 3.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .status-main {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
        }

        .status-main.active {
            color: rgba(100, 180, 255, 0.5);
        }

        .status-main.complete {
            color: #f5d742;
            animation: statusPulse 1.2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        .status-sub {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.12);
            margin-top: 0.05rem;
            transition: all 0.4s ease;
        }

        .status-sub.complete {
            color: rgba(245, 215, 66, 0.35);
        }

        .status-sub.active {
            color: rgba(100, 180, 255, 0.20);
        }

        /* ───────────────────────────────────────────────
                   BUTTONS – clean, subtle 3D
                ─────────────────────────────────────────────── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.8rem;
        }

        .btn {
            border: none;
            outline: none;
            padding: 0.8rem 2.8rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            min-width: 130px;
            position: relative;
            transform: perspective(800px) rotateX(0deg) translateZ(0);
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.2),
                0 8px 24px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .btn:hover:not(:disabled) {
            transform: perspective(800px) rotateX(2deg) translateZ(8px) scale(1.02);
            box-shadow:
                0 6px 0 rgba(0, 0, 0, 0.15),
                0 12px 36px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .btn:active:not(:disabled) {
            transform: perspective(800px) rotateX(0deg) translateZ(0) scale(0.96);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.25),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            opacity: 0.30;
            cursor: not-allowed;
            transform: perspective(800px) rotateX(0) translateZ(0);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 50%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ─── START Button ─── */
        .btn-start {
            background: linear-gradient(145deg, #6c8cff, #4a6fd6);
            color: #fff;
            box-shadow:
                0 4px 0 #3a5bb5,
                0 8px 32px rgba(108, 140, 255, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .btn-start:hover:not(:disabled) {
            background: linear-gradient(145deg, #7a9aff, #5a7ae6);
            box-shadow:
                0 6px 0 #3a5bb5,
                0 12px 40px rgba(108, 140, 255, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .btn-start.running {
            background: linear-gradient(145deg, #ff7a6a, #e65a4a);
            box-shadow:
                0 4px 0 #b54a3a,
                0 8px 32px rgba(255, 120, 100, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn-start.running:hover:not(:disabled) {
            background: linear-gradient(145deg, #ff8a7a, #f06a5a);
            box-shadow:
                0 6px 0 #b54a3a,
                0 12px 40px rgba(255, 120, 100, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .btn-start.complete {
            background: linear-gradient(145deg, #f5d742, #d4b82a);
            box-shadow:
                0 4px 0 #b49820,
                0 8px 32px rgba(245, 215, 66, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: btnGoldPulse 1.6s ease-in-out infinite;
        }

        .btn-start.complete:hover:not(:disabled) {
            background: linear-gradient(145deg, #ffe74a, #e5c832);
            box-shadow:
                0 6px 0 #b49820,
                0 12px 40px rgba(245, 215, 66, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        @keyframes btnGoldPulse {
            0%,
            100% {
                box-shadow: 0 4px 0 #b49820, 0 8px 32px rgba(245, 215, 66, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            }
            50% {
                box-shadow: 0 4px 0 #b49820, 0 8px 48px rgba(245, 215, 66, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            }
        }

        /* ─── RESET Button ─── */
        .btn-reset {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.30);
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 110px;
        }

        .btn-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow:
                0 6px 0 rgba(0, 0, 0, 0.12),
                0 12px 36px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        /* ───────────────────────────────────────────────
                   KEYBOARD SHORTCUTS
                ─────────────────────────────────────────────── */
        .keyboard-hint {
            margin-top: 1.4rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.10);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .keyboard-hint .hint-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 0.05rem 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-family: inherit;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.12);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .keyboard-hint .hint-sep {
            color: rgba(255, 255, 255, 0.04);
        }

        /* ───────────────────────────────────────────────
                   RESPONSIVE
                ─────────────────────────────────────────────── */
        @media (max-width: 500px) {
            .stopwatch {
                padding: 2rem 1.6rem 2.2rem;
                border-radius: 2.4rem;
                min-width: unset;
                max-width: 100%;
            }

            .stopwatch::before {
                border-radius: 2.4rem;
            }
            .stopwatch.round-complete::before {
                border-radius: 2.4rem;
            }

            .display {
                font-size: 4.8rem;
                letter-spacing: 1px;
            }

            .header-title {
                font-size: 0.75rem;
                letter-spacing: 6px;
            }

            .interval-label {
                font-size: 0.6rem;
                letter-spacing: 4px;
            }

            .rounds-display {
                font-size: 0.85rem;
            }
            .rounds-display .count {
                font-size: 0.95rem;
                padding: 0.05rem 0.6rem;
                min-width: 1.8rem;
            }

            .status-main {
                font-size: 1rem;
            }
            .status-sub {
                font-size: 0.65rem;
            }

            .controls {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .btn {
                padding: 0.7rem 1.8rem;
                min-width: 100px;
                font-size: 0.85rem;
                letter-spacing: 2px;
            }

            .btn-reset {
                min-width: 85px;
            }

            .keyboard-hint {
                gap: 1.2rem;
                font-size: 0.6rem;
            }
            .keyboard-hint kbd {
                font-size: 0.55rem;
                padding: 0.05rem 0.5rem;
            }
        }

          @media (max-width: 380px) {
            .stopwatch {
                padding: 1.5rem 1rem 1.8rem;
                border-radius: 1.8rem;
            }

            .stopwatch::before {
                border-radius: 1.8rem;
            }
            .stopwatch.round-complete::before {
                border-radius: 1.8rem;
            }

            .display {
                font-size: 3.6rem;
            }

            .header-title {
                font-size: 0.6rem;
                letter-spacing: 4px;
            }

            .rounds-display {
                font-size: 0.75rem;
            }
            .rounds-display .count {
                font-size: 0.8rem;
                padding: 0.05rem 0.5rem;
                min-width: 1.6rem;
            }

            .status-main {
                font-size: 0.85rem;
            }
            .status-sub {
                font-size: 0.55rem;
            }

            .btn {
                padding: 0.6rem 1.2rem;
                min-width: 80px;
                font-size: 0.7rem;
                letter-spacing: 1.5px;
            }

            .btn-reset {
                min-width: 70px;
            }

            .keyboard-hint {
                flex-direction: column;
                align-items: center;
                gap: 0.3rem;
                font-size: 0.5rem;
            }
            .keyboard-hint .hint-item {
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Animated Background ─── -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ─── Stopwatch ─── -->
    <div class="stopwatch" id="stopwatchCard">

        <!-- ROUND TIMER -->
        <div class="header-title">⏱️ Round Timer</div>

        <!-- WORK INTERVAL -->
        <div class="interval-label">Work Interval</div>

        <!-- Time Display -->
        <div class="display" id="display">
            <span class="sec" id="secondsDisplay">00</span>
            <span class="colon">.</span>
            <span class="cent" id="centsDisplay">00</span>
        </div>

        <!-- Rounds Completed -->
        <div class="rounds-display">
            Rounds Completed:&nbsp;
            <span class="count" id="roundBadge">0</span>
            <span class="total">of 18</span>
        </div>

        <!-- Status Area -->
        <div class="status-area">
            <div class="status-main" id="statusMain">Ready</div>
            <div class="status-sub" id="statusSub">Press START to begin</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-start" id="startBtn">Start</button>
            <button class="btn btn-reset" id="resetBtn">Reset</button>
        </div>

        <!-- Keyboard Shortcuts -->
        <div class="keyboard-hint">
            <span class="hint-item">
                <kbd>Space</kbd> to Start/Pause
            </span>
            <span class="hint-sep">·</span>
            <span class="hint-item">
                <kbd>R</kbd> to Reset
            </span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const display = document.getElementById('display');
            const secondsEl = document.getElementById('secondsDisplay');
            const centsEl = document.getElementById('centsDisplay');
            const roundBadge = document.getElementById('roundBadge');
            const statusMain = document.getElementById('statusMain');
            const statusSub = document.getElementById('statusSub');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const card = document.getElementById('stopwatchCard');

            // ─── Constants ───
            const LIMIT_SECONDS = 15;
            const LIMIT_CENTS = LIMIT_SECONDS * 100;
            const TOTAL_ROUNDS = 18;

            // ─── State ───
            let time = 0;
            let running = false;
            let roundCount = 0;
            let complete = false;
            let intervalId = null;

            // ─── Helpers ───
            function formatTime(centiseconds) {
                const totalSec = Math.floor(centiseconds / 100);
                const sec = totalSec % 60;
                const cent = centiseconds % 100;
                return {
                    sec: String(sec).padStart(2, '0'),
                    cent: String(cent).padStart(2, '0'),
                };
            }

            function updateDisplay() {
                const { sec, cent } = formatTime(time);
                secondsEl.textContent = sec;
                centsEl.textContent = cent;

                display.classList.remove('running', 'complete');
                if (running) display.classList.add('running');
                if (complete) display.classList.add('complete');
            }

            function updateUI() {
                updateDisplay();
                roundBadge.textContent = roundCount;

                // Status
                if (complete) {
                    statusMain.textContent = '🎯 Round Complete!';
                    statusMain.className = 'status-main complete';
                    statusSub.textContent = 'Press START Again';
                    statusSub.className = 'status-sub complete';
                    card.classList.add('round-complete');
                } else if (running) {
                    statusMain.textContent = '⏳ Running...';
                    statusMain.className = 'status-main active';
                    statusSub.textContent = 'Press SPACE to pause';
                    statusSub.className = 'status-sub active';
                    card.classList.remove('round-complete');
                } else {
                    statusMain.textContent = time === 0 ? 'Ready' : 'Paused';
                    statusMain.className = 'status-main';
                    statusSub.textContent = time === 0 ? 'Press START to begin' : 'Press START to resume';
                    statusSub.className = 'status-sub';
                    card.classList.remove('round-complete');
                }

                // Start button
                startBtn.textContent = complete ? 'Start' : (running ? 'Stop' : 'Start');
                startBtn.className = 'btn btn-start' + (running ? ' running' : '') + (complete ? ' complete' : '');
                startBtn.disabled = false;

                // Reset button
                resetBtn.disabled = (time === 0 && roundCount === 0 && !running && !complete);
            }

            // ─── Core: tick ───
            function tick() {
                if (!running) return;

                time += 1;

                if (time >= LIMIT_CENTS) {
                    time = LIMIT_CENTS;
                    running = false;
                    complete = true;
                    roundCount += 1;

                    roundBadge.classList.remove('pop');
                    void roundBadge.offsetWidth;
                    roundBadge.classList.add('pop');

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }

                    updateUI();
                    return;
                }

                updateUI();
            }

            // ─── Start / Stop toggle ───
            function startStop() {
                if (complete) {
                    running = true;
                    complete = false;
                    time = 0;

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    intervalId = setInterval(tick, 10);
                    updateUI();
                    return;
                }

                if (running) {
                    running = false;
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    updateUI();
                    return;
                }

                if (time >= LIMIT_CENTS) {
                    return;
                }

                running = true;
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                intervalId = setInterval(tick, 10);
                updateUI();
            }

            // ─── Full reset ───
            function fullReset() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                running = false;
                complete = false;
                time = 0;
                roundCount = 0;

                display.classList.remove('running', 'complete');
                card.classList.remove('round-complete');
                updateUI();
            }

            // ─── Keyboard shortcuts ───
            function onKeydown(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    startBtn.click();
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetBtn.click();
                }
            }

            // ─── Init ───
            function init() {
                updateUI();

                startBtn.addEventListener('click', startStop);
                resetBtn.addEventListener('click', fullReset);
                document.addEventListener('keydown', onKeydown);

                window.addEventListener('beforeunload', function() {
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                });
            }

            init();

        })();
    </script>

</body>
</html>
