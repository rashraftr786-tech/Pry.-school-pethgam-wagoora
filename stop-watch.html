<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>15‑Second Stopwatch · Round Counter</title>
    <style>
        /* ───────────────────────────────────────────────
                   RESET & BASE
                ─────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0e1a;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            overflow: hidden;
            padding: 1rem;
        }

        /* ─── Animated Background Orbs ─── */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: orbFloat 22s ease-in-out infinite alternate;
        }

        .bg-orbs .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -15%;
            right: -10%;
            background: radial-gradient(circle, #6c8cff, #3a5bd1);
            animation-duration: 24s;
            opacity: 0.30;
        }

        .bg-orbs .orb:nth-child(2) {
            width: 450px;
            height: 450px;
            bottom: -15%;
            left: -10%;
            background: radial-gradient(circle, #f093fb, #f5576c);
            animation-duration: 28s;
            animation-delay: -4s;
            opacity: 0.20;
        }

        .bg-orbs .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, #4facfe, #00f2fe);
            animation-duration: 20s;
            animation-delay: -8s;
            opacity: 0.16;
        }

        .bg-orbs .orb:nth-child(4) {
            width: 250px;
            height: 250px;
            bottom: 25%;
            right: 20%;
            background: radial-gradient(circle, #f5d742, #f59e42);
            animation-duration: 18s;
            animation-delay: -12s;
            opacity: 0.12;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(40px, -50px) scale(1.10) rotate(5deg);
            }
            66% {
                transform: translate(-30px, 40px) scale(0.92) rotate(-3deg);
            }
            100% {
                transform: translate(20px, -30px) scale(1.06) rotate(4deg);
            }
        }

        /* ───────────────────────────────────────────────
                   GLASS CARD – premium glass-morphism
                ─────────────────────────────────────────────── */
        .stopwatch {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem 3.5rem 3.5rem;
            border-radius: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 30px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            min-width: 440px;
            transition: box-shadow 0.5s ease, border-color 0.5s ease, transform 0.4s ease;
            animation: cardEntry 0.9s ease both;
        }

        .stopwatch:hover {
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow:
                0 40px 90px -16px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ─── Glow Ring ─── */
        .stopwatch::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 3.5rem;
            padding: 2px;
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(108, 140, 255, 0.12),
                    rgba(245, 215, 66, 0.06),
                    transparent 70%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: spinGlow 16s linear infinite;
        }

        @keyframes spinGlow {
            to {
                transform: rotate(360deg);
            }
        }

        .stopwatch.round-complete::before {
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(245, 215, 66, 0.20),
                    rgba(255, 215, 0, 0.08),
                    transparent 70%);
        }

        .stopwatch.round-complete {
            border-color: rgba(245, 215, 66, 0.15);
            box-shadow:
                0 30px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(245, 215, 66, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 60px rgba(245, 215, 66, 0.04);
        }

        /* ───────────────────────────────────────────────
                   TITLE
                ─────────────────────────────────────────────── */
        .title {
            color: rgba(255, 255, 255, 0.30);
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        /* ───────────────────────────────────────────────
                   TIME DISPLAY  (SS.cc) – LARGER & BOLDER
                ─────────────────────────────────────────────── */
        .display {
            font-size: 6.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
            padding: 0.2rem 0 0.1rem;
            line-height: 1.05;
            transition: all 0.4s ease;
            font-family: 'Courier New', 'Fira Code', monospace;
            background: linear-gradient(135deg, #f0f4fe 30%, #6c8cff 70%, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 40px rgba(108, 140, 255, 0.08));
        }

        .display .sec,
        .display .cent {
            -webkit-text-fill-color: transparent;
            transition: all 0.4s ease;
        }

        .display .colon {
            -webkit-text-fill-color: rgba(255, 255, 255, 0.15);
            margin: 0 0.05em;
        }

        .display.running .sec {
            background: linear-gradient(135deg, #7fc4ff, #4a9eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .display.running .cent {
            background: linear-gradient(135deg, #4a9eff, #6c8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .display.complete .sec {
            background: linear-gradient(135deg, #f5d742, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldPulse 1.2s ease-in-out infinite;
        }

        .display.complete .cent {
            background: linear-gradient(135deg, #d4b82a, #f5d742);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldPulse 1.2s ease-in-out infinite 0.1s;
        }

        @keyframes goldPulse {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(245, 215, 66, 0.1));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(245, 215, 66, 0.25));
            }
        }

        .display.running {
            background: linear-gradient(135deg, #7fc4ff, #4a9eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(74, 158, 255, 0.10));
        }

        /* ───────────────────────────────────────────────
                   ROUND COUNTER – with glass badge
                ─────────────────────────────────────────────── */
        .round-counter {
            margin-top: 0.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .round-counter .badge {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.25rem 1.2rem;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #b0c7e0;
            min-width: 3.2rem;
            display: inline-block;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .round-counter .badge.pop {
            animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop {
            0% {
                transform: scale(1);
                color: #f5d742;
                background: rgba(245, 215, 66, 0.10);
                border-color: rgba(245, 215, 66, 0.15);
            }
            50% {
                transform: scale(1.5);
                color: #ffd700;
                background: rgba(245, 215, 66, 0.15);
                border-color: rgba(245, 215, 66, 0.25);
            }
            100% {
                transform: scale(1);
                color: #b0c7e0;
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.04);
            }
        }

        .round-counter .label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.20);
            font-weight: 600;
        }

        /* ───────────────────────────────────────────────
                   STATUS MESSAGE
                ─────────────────────────────────────────────── */
        .status {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            height: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            font-weight: 500;
        }

        .status.active {
            color: rgba(100, 180, 255, 0.6);
        }
        .status.complete {
            color: rgba(245, 215, 66, 0.7);
            animation: statusGlow 1.2s ease-in-out infinite;
        }

        @keyframes statusGlow {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* ───────────────────────────────────────────────
                   3D CONTROLS – with depth & glow
                ─────────────────────────────────────────────── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .btn {
            border: none;
            outline: none;
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            min-width: 140px;
            position: relative;
            transform: perspective(800px) rotateX(0deg) translateZ(0);
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.2),
                0 8px 24px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* 3D depth effect on hover */
        .btn:hover:not(:disabled) {
            transform: perspective(800px) rotateX(2deg) translateZ(8px) scale(1.03);
            box-shadow:
                0 6px 0 rgba(0, 0, 0, 0.15),
                0 12px 36px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .btn:active:not(:disabled) {
            transform: perspective(800px) rotateX(0deg) translateZ(0) scale(0.96);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.25),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: perspective(800px) rotateX(0) translateZ(0);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), transparent 50%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ─── Start Button ─── */
        .btn-start {
            background: linear-gradient(145deg, #6c8cff, #4a6fd6);
            color: #fff;
            box-shadow:
                0 4px 0 #3a5bb5,
                0 8px 32px rgba(108, 140, 255, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .btn-start:hover:not(:disabled) {
            background: linear-gradient(145deg, #7a9aff, #5a7ae6);
            box-shadow:
                0 6px 0 #3a5bb5,
                0 12px 40px rgba(108, 140, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .btn-start.running {
            background: linear-gradient(145deg, #ff7a6a, #e65a4a);
            box-shadow:
                0 4px 0 #b54a3a,
                0 8px 32px rgba(255, 120, 100, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn-start.running:hover:not(:disabled) {
            background: linear-gradient(145deg, #ff8a7a, #f06a5a);
            box-shadow:
                0 6px 0 #b54a3a,
                0 12px 40px rgba(255, 120, 100, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .btn-start.complete {
            background: linear-gradient(145deg, #f5d742, #d4b82a);
            box-shadow:
                0 4px 0 #b49820,
                0 8px 32px rgba(245, 215, 66, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: btnGoldPulse 1.6s ease-in-out infinite;
        }

        .btn-start.complete:hover:not(:disabled) {
            background: linear-gradient(145deg, #ffe74a, #e5c832);
            box-shadow:
                0 6px 0 #b49820,
                0 12px 40px rgba(245, 215, 66, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        @keyframes btnGoldPulse {
            0%,
            100% {
                box-shadow: 0 4px 0 #b49820, 0 8px 32px rgba(245, 215, 66, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            }
            50% {
                box-shadow: 0 4px 0 #b49820, 0 8px 48px rgba(245, 215, 66, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            }
        }

        /* ─── Reset Button ─── */
        .btn-reset {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.35);
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 110px;
        }

        .btn-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow:
                0 6px 0 rgba(0, 0, 0, 0.12),
                0 12px 36px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        /* ───────────────────────────────────────────────
                   KEYBOARD HINT
                ─────────────────────────────────────────────── */
        .keyboard-hint {
            margin-top: 1.2rem;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.10);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 0.1rem 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-family: inherit;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            margin: 0 0.1rem;
        }

        /* ───────────────────────────────────────────────
                   RESPONSIVE
                ─────────────────────────────────────────────── */
        @media (max-width: 540px) {
            .stopwatch {
                padding: 2.2rem 1.8rem 2.5rem;
                min-width: unset;
                width: 96%;
                border-radius: 2.5rem;
            }

            .display {
                font-size: 4.4rem;
                letter-spacing: 1px;
            }

            .controls {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .btn {
                padding: 0.8rem 1.8rem;
                min-width: 110px;
                font-size: 0.85rem;
            }

            .btn-reset {
                min-width: 90px;
            }

            .round-counter .badge {
                font-size: 1.2rem;
                min-width: 2.8rem;
                padding: 0.2rem 1rem;
            }

            .stopwatch::before {
                border-radius: 2.5rem;
            }
            .stopwatch.round-complete::before {
                border-radius: 2.5rem;
            }
        }

        @media (max-width: 400px) {
            .stopwatch {
                padding: 1.6rem 1.2rem 2rem;
                border-radius: 2rem;
            }

            .display {
                font-size: 3.4rem;
            }

                      .btn {
                padding: 0.6rem 1.2rem;
                min-width: 80px;
                font-size: 0.7rem;
                letter-spacing: 1px;
            }

            .btn-reset {
                min-width: 70px;
            }

            .title {
                font-size: 0.6rem;
                letter-spacing: 3px;
            }

            .round-counter .badge {
                font-size: 1rem;
                min-width: 2.4rem;
                padding: 0.15rem 0.8rem;
            }

            .status {
                font-size: 0.65rem;
                height: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Animated Background ─── -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ─── Stopwatch ─── -->
    <div class="stopwatch" id="stopwatchCard">

        <!-- Title -->
        <div class="title">⏱️ Round Timer</div>

        <!-- Time Display – LARGER & BOLDER -->
        <div class="display" id="display">
            <span class="sec" id="secondsDisplay">00</span>
            <span class="colon">.</span>
            <span class="cent" id="centsDisplay">00</span>
        </div>

        <!-- Round Counter -->
        <div class="round-counter">
            <span class="label">Rounds</span>
            <span class="badge" id="roundBadge">0</span>
        </div>

        <!-- Status -->
        <div class="status" id="status">Ready</div>

        <!-- Controls – 3D Buttons -->
        <div class="controls">
            <button class="btn btn-start" id="startBtn">Start</button>
            <button class="btn btn-reset" id="resetBtn">Reset</button>
        </div>

        <!-- Keyboard Hint -->
        <div class="keyboard-hint">
            <kbd>Space</kbd> start/stop &nbsp;·&nbsp; <kbd>R</kbd> reset
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const display = document.getElementById('display');
            const secondsEl = document.getElementById('secondsDisplay');
            const centsEl = document.getElementById('centsDisplay');
            const roundBadge = document.getElementById('roundBadge');
            const statusEl = document.getElementById('status');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const card = document.getElementById('stopwatchCard');

            // ─── Constants ───
            const LIMIT_SECONDS = 15;
            const LIMIT_CENTS = LIMIT_SECONDS * 100;

            // ─── State ───
            let time = 0;
            let running = false;
            let roundCount = 0;
            let complete = false;
            let intervalId = null;

            // ─── Helpers ───
            function formatTime(centiseconds) {
                const totalSec = Math.floor(centiseconds / 100);
                const sec = totalSec % 60;
                const cent = centiseconds % 100;
                return {
                    sec: String(sec).padStart(2, '0'),
                    cent: String(cent).padStart(2, '0'),
                };
            }

            function updateDisplay() {
                const { sec, cent } = formatTime(time);
                secondsEl.textContent = sec;
                centsEl.textContent = cent;

                display.classList.remove('running', 'complete');
                if (running) display.classList.add('running');
                if (complete) display.classList.add('complete');
            }

            function updateUI() {
                updateDisplay();
                roundBadge.textContent = roundCount;

                if (complete) {
                    statusEl.textContent = '🎯 Round complete! Press Start again';
                    statusEl.className = 'status complete';
                    card.classList.add('round-complete');
                } else if (running) {
                    statusEl.textContent = '⏳ Running...';
                    statusEl.className = 'status active';
                    card.classList.remove('round-complete');
                } else {
                    statusEl.textContent = time === 0 ? 'Ready' : 'Paused';
                    statusEl.className = 'status';
                    card.classList.remove('round-complete');
                }

                startBtn.textContent = complete ? 'Start' : (running ? 'Stop' : 'Start');
                startBtn.className = 'btn btn-start' + (running ? ' running' : '') + (complete ? ' complete' : '');
                startBtn.disabled = false;

                resetBtn.disabled = (time === 0 && roundCount === 0 && !running && !complete);
            }

            // ─── Core: tick ───
            function tick() {
                if (!running) return;

                time += 1;

                if (time >= LIMIT_CENTS) {
                    time = LIMIT_CENTS;
                    running = false;
                    complete = true;
                    roundCount += 1;

                    roundBadge.classList.remove('pop');
                    void roundBadge.offsetWidth;
                    roundBadge.classList.add('pop');

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }

                    updateUI();
                    return;
                }

                updateUI();
            }

            // ─── Start / Stop toggle ───
            function startStop() {
                if (complete) {
                    running = true;
                    complete = false;
                    time = 0;

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    intervalId = setInterval(tick, 10);
                    updateUI();
                    return;
                }

                if (running) {
                    running = false;
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    updateUI();
                    return;
                }

                if (time >= LIMIT_CENTS) {
                    return;
                }

                running = true;
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                intervalId = setInterval(tick, 10);
                updateUI();
            }

            // ─── Full reset ───
            function fullReset() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                running = false;
                complete = false;
                time = 0;
                roundCount = 0;

                display.classList.remove('running', 'complete');
                card.classList.remove('round-complete');
                updateUI();
            }

            // ─── Keyboard shortcuts ───
            function onKeydown(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    startBtn.click();
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetBtn.click();
                }
            }

            // ─── Init ───
            function init() {
                updateUI();

                startBtn.addEventListener('click', startStop);
                resetBtn.addEventListener('click', fullReset);
                document.addEventListener('keydown', onKeydown);

                window.addEventListener('beforeunload', function() {
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                });
            }

            init();

        })();
    </script>

</body>
</html>
