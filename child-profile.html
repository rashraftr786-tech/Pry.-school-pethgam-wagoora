<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .profile-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .profile-header {
      background: linear-gradient(135deg, var(--primary-color), #7c3aed);
      padding: 30px 20px 20px;
      text-align: center;
      color: white;
      position: relative;
    }

    .avatar-container {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 4px solid rgba(255, 255, 255, 0.3);
    }

    .avatar-container i {
      font-size: 42px;
      color: var(--primary-color);
    }

    .profile-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .profile-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .profile-body {
      padding: 24px 20px;
    }

    .info-group {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .info-group:last-child {
      border-bottom: none;
    }

    .info-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #eef2ff;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 1.1rem;
    }

    .info-content label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .info-content span {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .card-actions {
      padding: 0 20px 24px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: 2px solid var(--primary-color);
      border-color: transparent;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>

  <!-- Student Profile Card -->
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar-container">
        <i class="fa-solid fa-child"></i>
      </div>
      <h2 id="display-name">Loading...</h2>
      <p id="display-id">ID: --</p>
    </div>

    <div class="profile-body">
      <div class="info-group">
        <div class="info-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="info-content">
          <label>Class / Grade</label>
          <span id="display-class">--</span>
        </div>
      </div>

      <div class="info-group">
        <div class="info-icon"><i class="fa-solid fa-user-group"></i></div>
        <div class="info-content">
          <label>Parent / Guardian</label>
          <span id="display-parent">--</span>
        </div>
      </div>

      <div class="info-group">
        <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
        <div class="info-content">
          <label>Contact Number</label>
          <span id="display-contact">--</span>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn btn-primary" onclick="openEditModal()">
        <i class="fa-solid fa-pen-to-square"></i> Edit Profile
      </button>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Child Profile</h3>
      <form id="editForm">
        <div class="form-group">
          <label for="editName">Full Name</label>
          <input type="text" id="editName" required />
        </div>
        <div class="form-group">
          <label for="editClass">Class / Grade</label>
          <input type="text" id="editClass" required />
        </div>
        <div class="form-group">
          <label for="editParent">Parent Name</label>
          <input type="text" id="editParent" />
        </div>
        <div class="form-group">
          <label for="editContact">Contact Phone</label>
          <input type="text" id="editContact" />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replace with your project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get Student ID from URL query string (e.g. profile.html?id=101)
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id') || '101'; // Fallback ID for testing

    const docRef = doc(db, "students", studentId);

    // Load Profile Data from Firebase
    async function fetchProfile() {
      try {
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          
          // Populate Profile
          document.getElementById('display-name').innerText = data.name || 'N/A';
          document.getElementById('display-id').innerText = `ID: ${studentId}`;
          document.getElementById('display-class').innerText = data.class || 'N/A';
          document.getElementById('display-parent').innerText = data.parentName || 'N/A';
          document.getElementById('display-contact').innerText = data.parentContact || 'N/A';

          // Pre-fill Edit Inputs
          document.getElementById('editName').value = data.name || '';
          document.getElementById('editClass').value = data.class || '';
          document.getElementById('editParent').value = data.parentName || '';
          document.getElementById('editContact').value = data.parentContact || '';
        } else {
          document.getElementById('display-name').innerText = "Student Not Found";
        }
      } catch (err) {
        console.error("Error loading profile:", err);
      }
    }

    // Save Profile Changes back to Firebase
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const updatedData = {
        name: document.getElementById('editName').value,
        class: document.getElementById('editClass').value,
        parentName: document.getElementById('editParent').value,
        parentContact: document.getElementById('editContact').value,
        updatedAt: new Date().toISOString()
      };

      try {
        await updateDoc(docRef, updatedData);
        alert('Profile updated successfully!');
        closeEditModal();
        fetchProfile(); // Refresh UI
      } catch (err) {
        console.error("Error updating profile:", err);
        alert('Failed to update profile.');
      }
    });

    // Modal Control Functions
    window.openEditModal = () => {
      document.getElementById('editModal').style.display = 'flex';
    };

    window.closeEditModal = () => {
      document.getElementById('editModal').style.display = 'none';
    };

    // Initialize on page load
    fetchProfile();
  </script>
</body>
</html>
