<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp | GPS Pethgam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
        <h2 class="text-xl font-black mb-6 text-emerald-600"><i class="fab fa-whatsapp"></i> WhatsApp Alert</h2>
        
        <div class="space-y-4">
            <select id="studentSelect" class="w-full p-4 rounded-2xl border bg-slate-50 font-bold outline-none">
                <option value="">-- Choose Student --</option>
            </select>

            <select id="template" onchange="updateMsg()" class="w-full p-4 rounded-2xl border bg-slate-50 font-bold outline-none">
                <option value="">-- Choose Template --</option>
                <option value="Absent">Today's Absence Alert</option>
                <option value="Fee">Monthly Fee Reminder</option>
            </select>

            <textarea id="msgBody" rows="5" class="w-full p-4 rounded-2xl border bg-slate-50 font-bold text-sm outline-none" placeholder="Message content..."></textarea>

            <button onclick="sendWA()" class="w-full bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-emerald-600 transition">
                OPEN WHATSAPP & LOG
            </button>
        </div>
    </div>

    <script type="module">
        // ============================================================
        // 🔧 ADJUST THESE THREE VARIABLES TO MATCH YOUR FIRESTORE
        // ============================================================
        const MASTER_COLLECTION = "students";   // <<-- CHANGE to your actual collection name
        const NAME_FIELD = "name";              // <<-- field for student name
        const PHONE_FIELD = "fatherContact";    // <<-- field for parent's phone number
        // ============================================================

        import { db } from './init-firebase.js';
        import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Load students from Master Profile
        async function load() {
            const select = document.getElementById('studentSelect');
            select.innerHTML = '<option value="">-- Loading... --</option>';

            try {
                console.log(`🔍 Fetching from collection: "${MASTER_COLLECTION}"`);
                const snap = await getDocs(collection(db, MASTER_COLLECTION));
                console.log(`✅ Found ${snap.size} documents in "${MASTER_COLLECTION}"`);

                // Clear dropdown (keep placeholder)
                select.innerHTML = '<option value="">-- Choose Student --</option>';

                if (snap.empty) {
                    alert(`⚠️ No documents found in collection "${MASTER_COLLECTION}". Check your collection name.`);
                    select.innerHTML = '<option value="">-- No students --</option>';
                    return;
                }

                let loadedCount = 0;
                snap.forEach(doc => {
                    const data = doc.data();
                    console.log("📄 Document data:", data); // <<-- shows all fields in the console

                    // Try multiple possible field names
                    const name = data[NAME_FIELD] || data.name || data.fullName || data.studentName || "Unknown";
                    const phone = data[PHONE_FIELD] || data.fatherContact || data.phone || data.mobile || data.parentPhone || "";

                    if (!phone) {
                        console.warn(`⚠️ No phone number for ${name} – skipping`);
                        return;
                    }

                    const opt = document.createElement('option');
                    opt.value = phone;
                    opt.dataset.name = name;
                    opt.textContent = `${name} (${phone})`;
                    select.appendChild(opt);
                    loadedCount++;
                });

                console.log(`✅ Loaded ${loadedCount} students with phone numbers.`);
                if (loadedCount === 0) {
                    alert(`⚠️ Found ${snap.size} documents, but none had a phone number.\nCheck the PHONE_FIELD variable.`);
                }
            } catch (error) {
                console.error("❌ Error loading students:", error);
                alert(`❌ Failed to load: ${error.message}\nCheck console for details.`);
                select.innerHTML = '<option value="">-- Error loading --</option>';
            }
        }

        // Update message based on template
        window.updateMsg = () => {
            const select = document.getElementById('studentSelect');
            const selectedOption = select.selectedOptions[0];
            const name = selectedOption ? selectedOption.dataset.name : "Student";
            const type = document.getElementById('template').value;
            const msgArea = document.getElementById('msgBody');
            
            if (type === "Absent") {
                msgArea.value = `Dear Parent, your ward ${name} is absent today from GPS Pethgam. Please ensure regular attendance.`;
            } else if (type === "Fee") {
                msgArea.value = `Dear Parent, the monthly fee for ${name} is due. Please clear it at the school office.`;
            } else {
                msgArea.value = "";
            }
        };

        // Send WhatsApp and log
        window.sendWA = async () => {
            const select = document.getElementById('studentSelect');
            const phone = select.value;
            const msg = document.getElementById('msgBody').value;
            const name = select.selectedOptions[0]?.dataset.name || "Student";

            if (!phone) {
                alert("Please select a student first.");
                return;
            }
            if (!msg.trim()) {
                alert("Please enter a message or choose a template.");
                return;
            }

            try {
                // Save to Communication Logs
                await addDoc(collection(db, "comm_logs"), {
                    recipient: name,
                    phone: phone,
                    message: msg,
                    type: "WhatsApp",
                    date: new Date().toLocaleDateString(),
                    timestamp: new Date().toISOString()
                });
                console.log("✅ Log saved");
            } catch (error) {
                console.error("❌ Log save failed:", error);
                // Continue anyway
            }

            // Open WhatsApp
            window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // Load when page loads
        load();
    </script>
</body>
</html>
