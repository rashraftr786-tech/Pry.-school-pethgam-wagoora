<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Result | GPS Pethgam Wagoora</title>
  <!-- Chart.js, JsBarcode, QRCode -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* A4 print setup – tighter margins for single page */
    @page {
      size: A4;
      margin: 0.8cm;
    }

    body {
      background: #e6f0e6;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Navigation (hidden when printing) */
    .nav-header {
      background: #1a5d1a;
      padding: 10px 20px;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 1200px;
    }
    .nav-header a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 5px 15px;
      border-radius: 40px;
    }
    .nav-header a:hover { background: #2e7d32; }

    /* Search Card */
    .search-card {
      max-width: 550px;
      width: 100%;
      margin: 0 auto 35px;
      background: white;
      border-radius: 48px;
      padding: 20px 25px;
      text-align: center;
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
    }
    .search-card h2 { color: #1a5d1a; margin-bottom: 15px; font-size: 24px; }
    .search-card input {
      padding: 10px 18px;
      width: 200px;
      margin: 5px;
      border: 2px solid #ccc;
      border-radius: 50px;
    }
    .search-card button {
      background: #1a5d1a;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 50px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    /* Marksheet – single A4 with border */
    .marksheet {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      overflow: hidden;
      display: none;
      border: 2px solid #1a5d1a;
      box-shadow: 0 0 0 6px #f0f7f0, 0 0 0 10px #c8e6c9;
      position: relative;
    }

    /* School logo in header */
    .marksheet-header {
      background: linear-gradient(135deg, #0b3d0b, #1f6d1f);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      color: white;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-area img {
      height: 50px;
      width: auto;
      background: white;
      border-radius: 12px;
      padding: 4px;
    }
    .school-text {
      text-align: center;
      flex: 2;
    }
    .school-text h1 {
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .school-text p {
      font-size: 10px;
      opacity: 0.9;
    }

    /* Student info – tighter */
    .student-info-row {
      display: flex;
      flex-wrap: wrap;
      background: #fef9e6;
      padding: 12px 18px;
      gap: 15px;
      border-bottom: 2px solid #ffb74d;
    }
    .details-grid {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
      gap: 6px 15px;
      font-size: 12px;
    }
    .detail-item strong {
      color: #1a5d1a;
      display: inline-block;
      min-width: 90px;
    }
    .photo-area {
      flex: 1;
      text-align: center;
    }
    .photo-area img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffb74d;
      background: white;
    }

    /* Marks table – compact */
    .marks-table-wrapper {
      padding: 10px 18px;
      overflow-x: auto;
    }
    .marks-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }
    .marks-table th, .marks-table td {
      border: 1px solid #ccc;
      padding: 4px 2px;
      text-align: center;
    }
    .marks-table th {
      background: #ffb74d;
      color: #2c2c2c;
    }
    .subject-cell {
      background: #f5f5f5;
      font-weight: bold;
      text-align: left;
      padding-left: 8px;
    }
    .grand-total-row {
      background: #e8f5e9;
      font-weight: bold;
    }

    /* Info panels – side by side */
    .info-panels {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 0 18px 12px;
    }
    .grade-key, .final-results {
      flex: 1;
      background: #f1f8e9;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 11px;
    }
    .final-results { background: #fff3e0; }
    .grade-key h4, .final-results h4 {
      font-size: 13px;
      margin-bottom: 5px;
    }
    .grade-key table { width: 100%; font-size: 10px; }
    .final-results p { margin: 2px 0; }

    /* Bar chart – slightly smaller */
    .bar-chart-container {
      padding: 5px 18px 10px;
    }
    .bar-chart-container canvas {
      max-height: 160px;
      width: 100%;
    }

    /* Extra activities – compact */
    .extra-activities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 5px 18px;
      background: #f9f9f9;
    }
    .extra-box {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 5px;
      text-align: center;
      font-size: 10px;
    }

    /* Remarks */
    .remarks {
      background: #fff8e1;
      margin: 8px 18px;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      border-left: 5px solid #ffb74d;
    }

    /* QR + Barcode section */
    .verification-codes {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 10px 18px;
      background: #fafafa;
      border-top: 1px dashed #ccc;
      border-bottom: 1px dashed #ccc;
      margin: 8px 0;
    }
    .qr-code, .barcode {
      text-align: center;
    }
    .qr-code canvas, .barcode svg {
      width: 80px;
      height: 80px;
    }
    .verification-codes small {
      font-size: 9px;
      display: block;
    }

    /* Signatures */
    .signatures {
      display: flex;
      justify-content: space-between;
      padding: 12px 22px 18px;
      font-size: 10px;
    }
    .print-btn {
      display: block;
      width: 180px;
      margin: 12px auto 20px;
      background: #1a5d1a;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Print optimisation – ensure single page */
    @media print {
      .nav-header, .search-card, .print-btn { display: none; }
      body { background: white; padding: 0; margin: 0; }
      .marksheet {
        box-shadow: none;
        border: 1px solid #1a5d1a;
        margin: 0 auto;
        max-width: 100%;
        border-radius: 0;
      }
      .marksheet-header { background: #1a5d1a; color: white; }
      .student-info-row, .grade-key, .final-results, .extra-box, .remarks {
        break-inside: avoid;
      }
      .marks-table, .bar-chart-container, .verification-codes {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* Ensure backgrounds and borders print */
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
<div class="nav-header">
  <a href="admission.html">📝 Admission</a>
  <a href="adm-register.html">📋 Register</a>
  <a href="upload-results.html">📤 Upload Marks</a>
  <a href="results.html">🎓 Online Result</a>
  <a href="master-profile.html">📊 Master Record</a>
  <a href="ver-survey.html">📋 VER Survey</a>
</div>

<div class="search-card">
  <h2>🌟 Student Result Portal</h2>
  <input type="text" id="admNo" placeholder="Admission No (e.g., 117)">
  <span style="font-weight:bold;">OR</span>
  <input type="text" id="rollNo" placeholder="Roll No (e.g., 404)">
  <div><button id="searchBtn">🔍 Get Marksheet</button></div>
</div>

<div id="marksheetContainer" class="marksheet"></div>

<script type="module">
  import { db } from './init-firebase.js';
  import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { calculateGrades, getProficiencyLevel } from './results-handler.js';

  async function findAdmByRoll(roll) {
    const q = query(collection(db, "students"), where("rollNo", "==", String(roll)));
    const snap = await getDocs(q);
    return snap.empty ? null : snap.docs[0].data().admNo;
  }

  async function fetchStudentData(admNo) {
    const studentRef = doc(db, "students", admNo);
    const studentSnap = await getDoc(studentRef);
    if (!studentSnap.exists()) return null;
    const student = studentSnap.data();
    const resQuery = query(collection(db, "results"), where("admNo", "==", String(admNo)), where("session", "==", "Oct 2025"));
    const resSnap = await getDocs(resQuery);
    const result = resSnap.empty ? null : resSnap.docs[0].data();
    return { student, result };
  }

  document.getElementById('searchBtn').addEventListener('click', async () => {
    const admVal = document.getElementById('admNo').value.trim();
    const rollVal = document.getElementById('rollNo').value.trim();
    let admNo = admVal;
    if (!admNo && rollVal) admNo = await findAdmByRoll(rollVal);
    if (!admNo) {
      alert('Please enter a valid Admission Number or Roll Number.');
      return;
    }
    const container = document.getElementById('marksheetContainer');
    container.style.display = 'block';
    container.innerHTML = '<div style="text-align:center; padding:40px;">⏳ Loading marksheet...</div>';
    
    const data = await fetchStudentData(admNo);
    if (!data || !data.result) {
      container.innerHTML = '<div style="text-align:center; color:red; padding:40px;">❌ No record found for Oct 2025 session.</div>';
      return;
    }
    renderMarksheet(data.student, data.result);
  });

  function renderMarksheet(student, result) {
    const subjects = ['English', 'Mathematics', 'Environment Science', 'Urdu', 'Kashmiri'];
    const display = ['English', 'Math', 'EVS', 'Urdu', 'Kashmiri'];
    
    let grandTotal = 0;
    let subjectPercentages = [];
    let rowsHtml = '';

    for (let i=0; i<subjects.length; i++) {
      const subKey = subjects[i];
      const m = result.marks?.[subKey] || { fa: [0,0,0,0,0,0], cca:0, sa:0 };
      const fa = m.fa.map(v => Number(v)||0);
      const faSum = fa.reduce((a,b)=>a+b,0);
      const cc = Number(m.cca)||0;
      const sa = Number(m.sa)||0;
      const subTotal = faSum + cc + sa;
      grandTotal += subTotal;
      const subPercent = (subTotal/100)*100;
      subjectPercentages.push(subPercent);
      const gradeObj = calculateGrades(subPercent, 100);
      const proficiency = getProficiencyLevel(subPercent);
      
      rowsHtml += `<tr>
        <td class="subject-cell">${display[i]}</td>
        ${fa.map(v => `<td>${v}</td>`).join('')}
        <td>${faSum}</td><td>${cc}</td><td>${sa}</td>
        <td><strong>${subTotal}</strong></td>
        <td>${gradeObj.grade}</td>
        <td>${proficiency}</td>
      </tr>`;
    }

    const overallPercent = (grandTotal/500)*100;
    const overallGrade = calculateGrades(overallPercent, 500);
    const overallProf = getProficiencyLevel(overallPercent);
    const resultText = overallPercent >= 33 ? '✅ PROMOTED' : '❌ NOT PROMOTED';

    const gradeKeyHtml = `
      <h4>📊 Percentage / Grade Key</h4>
      <table><tr><td>>85% - 100%</td><td>A+ (Sky)</td></tr>
      <tr><td>>70% - 85%</td><td>A (Mountain)</td></tr>
      <tr><td>>55% - 70%</td><td>B (Stream)</td></tr>
      <tr><td>>40% - 55%</td><td>C (Stream)</td></tr>
      <tr><td>>33% - 40%</td><td>D (Stream)</td></tr></table>
    `;
    const finalHtml = `
      <h4>🎯 Final Results</h4>
      <p><strong>Total Marks:</strong> ${grandTotal} / 500</p>
      <p><strong>%age:</strong> ${overallPercent.toFixed(2)}%</p>
      <p><strong>Result:</strong> ${resultText}</p>
      <p><strong>Grade:</strong> ${overallGrade.grade}</p>
      <p><strong>Proficiency:</strong> ${overallProf}</p>
    `;

    // Extra fields
    const attendance = result.attendance || '92%';
    const discipline = result.discipline || 'A';
    const sports = result.sports || 'Excellent';
    const artCraft = result.artCraft || 'A+';
    const socialSkills = result.socialSkills || 'Good';
    const teamwork = result.teamwork || 'A';
    const remarks = result.remarks || `${student.name || ''} has shown ${overallProf.toLowerCase()} level performance.`;

    // Determine photo URL
    const photoUrl = student.photoURL && student.photoURL !== '' ? student.photoURL : 'https://via.placeholder.com/90?text=📷';

    // Unique verification ID (student ID + timestamp)
    const verifyId = `${student.admNo}_${Date.now()}`;
    const verificationUrl = `${window.location.origin}${window.location.pathname}?verify=${verifyId}`;

    const marksheetHtml = `
      <div class="marksheet-header">
        <div class="logo-area">
          <img src="logo.png" alt="School Logo" onerror="this.style.display='none'">
        </div>
        <div class="school-text">
          <h1>GOVERNMENT PRIMARY SCHOOL PETHGAM WAGOORA</h1>
          <p>Wagoora Babareshi Road Near ZEO Office, Baramulla, J&K - 193109 | UDISE: 01022202207</p>
        </div>
        <div style="width:50px;"></div> <!-- spacer for balance -->
      </div>
      <div class="student-info-row">
        <div class="details-grid">
          <div class="detail-item"><strong>Student Name:</strong> ${student.name || student.studentName || ''}</div>
          <div class="detail-item"><strong>Adm. No:</strong> ${student.admNo}</div>
          <div class="detail-item"><strong>Roll No:</strong> ${student.rollNo || '-'}</div>
          <div class="detail-item"><strong>Father's Name:</strong> ${student.fatherName || ''}</div>
          <div class="detail-item"><strong>Mother's Name:</strong> ${student.motherName || ''}</div>
          <div class="detail-item"><strong>D.O.B:</strong> ${student.dob || ''}</div>
          <div class="detail-item"><strong>Class:</strong> ${student.class || ''}</div>
          <div class="detail-item"><strong>Session:</strong> Oct 2025</div>
          <div class="detail-item"><strong>Apara ID:</strong> ${student.apaarId || student.apaarID || '-'}</div>
          <div class="detail-item"><strong>PEN No.:</strong> ${student.penNo || student.penNumber || '-'}</div>
        </div>
        <div class="photo-area">
          <img src="${photoUrl}" alt="Student Photo" onerror="this.src='https://via.placeholder.com/90?text=No+Photo'">
        </div>
      </div>
      
      <div class="marks-table-wrapper">
        <table class="marks-table">
          <thead><tr><th>Subject</th><th>FA1</th><th>FA2</th><th>FA3</th><th>FA4</th><th>FA5</th><th>FA6</th><th>T(30)</th><th>CC(20)</th><th>Sum(50)</th><th>Total</th><th>Grade</th><th>Proficiency</th></tr></thead>
          <tbody>
            ${rowsHtml}
            <tr class="grand-total-row"><td colspan="7"><strong>Grand Total</strong></td><td><strong>74</strong></td><td><strong>50</strong></td><td><strong>119</strong></td><td><strong>${grandTotal}</strong></td><td colspan="2"><strong>Overall: ${overallGrade.grade}</strong></td></tr>
          </tbody>
        </table>
      </div>
      
      <div class="info-panels">
        <div class="grade-key">${gradeKeyHtml}</div>
        <div class="final-results">${finalHtml}</div>
      </div>
      
      <div class="bar-chart-container">
        <canvas id="subjectChart"></canvas>
      </div>
      
      <div class="extra-activities">
        <div class="extra-box">🏃‍♂️ <strong>Sports</strong><br>${sports}</div>
        <div class="extra-box">🤝 <strong>Teamwork</strong><br>${teamwork}</div>
        <div class="extra-box">📏 <strong>Discipline</strong><br>${discipline}</div>
        <div class="extra-box">🎨 <strong>Art & Craft</strong><br>${artCraft}</div>
        <div class="extra-box">🗣️ <strong>Social Skills</strong><br>${socialSkills}</div>
        <div class="extra-box">📊 <strong>Attendance</strong><br>${attendance}</div>
      </div>
      
      <div class="remarks">
        <strong>📝 General Remarks</strong><br>${remarks}
      </div>
      
      <div class="verification-codes">
        <div class="qr-code">
          <div id="qrCodeDiv"></div>
          <small>Scan to Verify</small>
        </div>
        <div class="barcode">
          <svg id="studentBarcode"></svg>
          <small>Student ID Barcode</small>
        </div>
      </div>
      
      <div class="signatures">
        <div>Sign. Form Teacher</div>
        <div>Sign. Exam I/C</div>
        <div>Parents Signature</div>
        <div>Seal & Sign. Headmaster</div>
      </div>
      <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
    `;
    
    document.getElementById('marksheetContainer').innerHTML = marksheetHtml;
    
    // Draw bar chart
    const ctx = document.getElementById('subjectChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: display,
        datasets: [{
          label: 'Percentage (%)',
          data: subjectPercentages,
          backgroundColor: ['#2e7d32','#ffb74d','#42a5f5','#ab47bc','#ef5350'],
          borderRadius: 8,
          barPercentage: 0.7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } },
        scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: 'Percentage', font: { size: 10 } } } }
      }
    });
    
    // Generate barcode
    const barcodeValue = `${student.admNo}-${student.rollNo || '000'}`;
    JsBarcode("#studentBarcode", barcodeValue, { format: "CODE128", width: 1.4, height: 40, displayValue: true, fontSize: 10 });
    
    // Generate QR code
    new QRCode(document.getElementById("qrCodeDiv"), {
      text: verificationUrl,
      width: 80,
      height: 80,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }
</script>
</body>
</html>
