<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e1a" />

  <title>Sign In · SchoolERP</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(108,140,255,.15), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(90,111,214,.12), transparent 30%),
        #0b0e1a;
      color: #f0f4fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 2rem;

      box-shadow:
        0 25px 50px -12px rgba(0,0,0,0.6),
        inset 0 1px rgba(255,255,255,.05);

      padding: 2.8rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .brand h1 {
      font-size: 1.6rem;

      background: linear-gradient(
        135deg,
        #f0f4fe 60%,
        #6c8cff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: .75rem;
      color: rgba(255,255,255,.5);
      margin-top: .3rem;
    }

    .role-toggle {
      display: flex;
      gap: .5rem;
      margin: 1.2rem 0 1.5rem;

      background: rgba(255,255,255,.04);
      padding: .3rem;

      border-radius: 3rem;
      border: 1px solid rgba(255,255,255,.05);
    }

    .role-toggle button {
      flex: 1;
      padding: .55rem .25rem;

      border: none;
      border-radius: 2rem;

      font-weight: 600;
      font-size: .78rem;

      cursor: pointer;

      background: transparent;
      color: rgba(255,255,255,.65);

      transition: .3s;
    }

    .role-toggle button.active {
      background: rgba(108,140,255,.2);
      color: #fff;

      box-shadow:
        0 4px 16px rgba(108,140,255,.15);
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;

      font-size: .75rem;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 1px;

      color: rgba(255,255,255,.65);

      margin-bottom: .4rem;
    }

    .form-group input {
      width: 100%;

      padding: .9rem 1.2rem;

      border-radius: 2rem;

      border: 1px solid rgba(255,255,255,.08);

      background: rgba(255,255,255,.04);

      color: #f0f4fe;

      font-size: .95rem;

      outline: none;

      transition: .3s;
    }

    .form-group input::placeholder {
      color: rgba(255,255,255,.3);
    }

    .form-group input:focus {
      border-color: rgba(108,140,255,.5);

      background: rgba(255,255,255,.07);

      box-shadow:
        0 0 0 3px rgba(108,140,255,.08);
    }

    .error-msg {
      background: rgba(255,107,107,.08);

      border: 1px solid rgba(255,107,107,.15);

      border-radius: 1rem;

      padding: .8rem 1rem;

      font-size: .8rem;

      color: #ff8585;

      margin-bottom: 1.2rem;

      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .success-msg {
      background: rgba(80,220,150,.08);

      border: 1px solid rgba(80,220,150,.15);

      border-radius: 1rem;

      padding: .8rem 1rem;

      font-size: .8rem;

      color: #6ee7a3;

      margin-bottom: 1.2rem;

      display: none;
    }

    .success-msg.show {
      display: block;
    }

    .btn-signin {
      width: 100%;

      padding: .95rem;

      border: none;
      border-radius: 3rem;

      font-size: 1rem;
      font-weight: 700;

      cursor: pointer;

      transition: .3s;

      background:
        linear-gradient(
          135deg,
          #6c8cff,
          #5a6fd6
        );

      color: #fff;

      box-shadow:
        0 8px 30px rgba(108,140,255,.25);
    }

    .btn-signin:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 12px 40px rgba(108,140,255,.35);
    }

    .btn-signin:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .forgot {
      margin-top: 1.2rem;
      font-size: .75rem;
    }

    .forgot a {
      color: #8da5ff;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .footer-link {
      margin-top: 1.5rem;

      font-size: .7rem;

      color: rgba(255,255,255,.35);
    }

    .footer-link a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
    }

    .footer-link a:hover {
      color: #fff;
    }

    .security-note {
      margin-top: 1.2rem;

      font-size: .68rem;

      color: rgba(255,255,255,.3);

      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .glass {
        padding: 2rem 1.5rem;
      }

      .role-toggle button {
        font-size: .72rem;
      }
    }
  </style>
</head>

<body>

<div class="glass">

  <div class="brand">

    <h1>🏫 ERP Portal</h1>

    <div class="brand-sub">
      Government Primary School Pethgam Wagoora
    </div>

  </div>


  <!-- Role Selection -->
  <div class="role-toggle">

    <button
      type="button"
      class="active"
      data-role="admin">
      👤 Admin
    </button>

    <button
      type="button"
      data-role="teacher">
      👨‍🏫 Teacher
    </button>

    <button
      type="button"
      data-role="student">
      👩‍🎓 Student
    </button>

  </div>


  <!-- Error -->
  <div
    class="error-msg"
    id="errorMsg">

    <span id="errorText"></span>

  </div>


  <!-- Success -->
  <div
    class="success-msg"
    id="successMsg">

    <span id="successText"></span>

  </div>


  <!-- Login Form -->
  <form id="signinForm">

    <div class="form-group">

      <label for="emailInput">
        Email Address
      </label>

      <input
        type="email"
        id="emailInput"
        placeholder="Enter your email"
        autocomplete="username"
        required />

    </div>


    <div class="form-group">

      <label for="passwordInput">
        Password
      </label>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter your password"
        autocomplete="current-password"
        required />

    </div>


    <button
      type="submit"
      class="btn-signin"
      id="signinBtn">

      🚀 Sign In

    </button>

  </form>


  <div class="forgot">

    <a href="forgot-password.html">
      Forgot your password?
    </a>

  </div>


  <div class="security-note">

    🔐 Secure authentication powered by Firebase

  </div>


  <div class="footer-link">

    <a href="index.html">
      ← Back to Home
    </a>

  </div>

</div>


<script>

(function () {

  "use strict";


  /* =====================================================
     FIREBASE CONFIGURATION
     ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDgVFdfKpCrLkoRsMI2gS7ajlJUzVdYLZU",

    authDomain:
      "pry-school-pethgam-wagoora.firebaseapp.com",

    projectId:
      "pry-school-pethgam-wagoora",

    storageBucket:
      "pry-school-pethgam-wagoora.firebasestorage.app",

    messagingSenderId:
      "255417366612",

    appId:
      "1:255417366612:web:81cec46aa75cb7d4ba95c1",

    measurementId:
      "G-JE9WY9T6FJ"

  };


  /* =====================================================
     DOM
     ===================================================== */

  const form =
    document.getElementById("signinForm");

  const emailInput =
    document.getElementById("emailInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const signinBtn =
    document.getElementById("signinBtn");

  const errorMsg =
    document.getElementById("errorMsg");

  const errorText =
    document.getElementById("errorText");

  const successMsg =
    document.getElementById("successMsg");

  const successText =
    document.getElementById("successText");

  const roleBtns =
    document.querySelectorAll(
      ".role-toggle button"
    );


  let selectedRole = "admin";


  /* =====================================================
     INITIALIZE FIREBASE
     ===================================================== */

  let auth;

  try {

    if (!firebase.apps.length) {

      firebase.initializeApp(
        firebaseConfig
      );

    }

    auth = firebase.auth();

    console.log(
      "✅ Firebase Authentication initialized."
    );

  }

  catch (error) {

    console.error(
      "Firebase initialization failed:",
      error
    );

    showError(
      "Firebase could not be initialized. Please check your Firebase configuration."
    );

    signinBtn.disabled = true;

    return;

  }


  /* =====================================================
     ROLE BUTTONS
     ===================================================== */

  roleBtns.forEach(function (button) {

    button.addEventListener(
      "click",
      function () {

        roleBtns.forEach(function (btn) {

          btn.classList.remove(
            "active"
          );

        });

        this.classList.add(
          "active"
        );

        selectedRole =
          this.dataset.role;

        hideMessages();

      }
    );

  });


  /* =====================================================
     ERROR FUNCTIONS
     ===================================================== */

  function showError(message) {

    errorText.textContent =
      message;

    errorMsg.classList.add(
      "show"
    );

    successMsg.classList.remove(
      "show"
    );

  }


  function showSuccess(message) {

    successText.textContent =
      message;

    successMsg.classList.add(
      "show"
    );

    errorMsg.classList.remove(
      "show"
    );

  }


  function hideMessages() {

    errorMsg.classList.remove(
      "show"
    );

    successMsg.classList.remove(
      "show"
    );

  }


  /* =====================================================
     FIREBASE ERROR TRANSLATOR
     ===================================================== */

  function getFirebaseErrorMessage(
    error
  ) {

    switch (error.code) {

      case "auth/invalid-email":

        return "Please enter a valid email address.";


      case "auth/user-disabled":

        return "This account has been disabled by the administrator.";


      case "auth/user-not-found":

        return "No Firebase account exists with this email address.";


      case "auth/wrong-password":

        return "The password is incorrect.";


      case "auth/invalid-credential":

        return "The email or password is incorrect.";


      case "auth/too-many-requests":

        return "Too many unsuccessful attempts. Please wait and try again.";


      case "auth/network-request-failed":

        return "Network error. Please check your internet connection.";


      case "auth/operation-not-allowed":

        return "Email/password authentication is not enabled in Firebase.";


      default:

        return error.message ||
          "Unable to sign in. Please try again.";

    }

  }


  /* =====================================================
     SIGN IN
     ===================================================== */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      hideMessages();


      const email =
        emailInput.value
          .trim()
          .toLowerCase();

      const password =
        passwordInput.value;


      /* Validation */

      if (!email) {

        showError(
          "Please enter your email address."
        );

        emailInput.focus();

        return;

      }


      if (!password) {

        showError(
          "Please enter your password."
        );

        passwordInput.focus();

        return;

      }


      /* Loading */

      signinBtn.disabled = true;

      signinBtn.textContent =
        "⏳ Signing in...";


      try {

        /* ==========================================
           REAL FIREBASE AUTHENTICATION
           ========================================== */

        const userCredential =
          await auth.signInWithEmailAndPassword(
            email,
            password
          );


        const user =
          userCredential.user;


        console.log(
          "✅ Firebase login successful."
        );

        console.log(
          "User:",
          user.email
        );


        /* ==========================================
           SAVE SESSION INFORMATION
           ========================================== */

        localStorage.setItem(
          "userRole",
          selectedRole
        );

        localStorage.setItem(
          "userEmail",
          user.email
        );

        localStorage.setItem(
          "firebaseUid",
          user.uid
        );


        /* ==========================================
           SUCCESS
           ========================================== */

        showSuccess(
          "Login successful. Opening School ERP..."
        );


        signinBtn.textContent =
          "✓ Signed In";


        /* ==========================================
           REDIRECT
           ========================================== */

        setTimeout(function () {

          window.location.href =
            "master-profile.html";

        }, 800);


      }

      catch (error) {

        console.error(
          "❌ Firebase Authentication Error:",
          error
        );


        showError(
          getFirebaseErrorMessage(
            error
          )
        );


        signinBtn.disabled =
          false;

        signinBtn.textContent =
          "🚀 Sign In";

      }

    }
  );


  /* =====================================================
     CLEAR ERRORS WHEN USER TYPES
     ===================================================== */

  emailInput.addEventListener(
    "input",
    hideMessages
  );

  passwordInput.addEventListener(
    "input",
    hideMessages
  );


  /* =====================================================
     AUTH STATE MONITOR
     ===================================================== */

  auth.onAuthStateChanged(
    function (user) {

      if (user) {

        console.log(
          "Current Firebase user:",
          user.email
        );

      }

      else {

        console.log(
          "No Firebase user currently signed in."
        );

      }

    }
  );


  console.log(
    "🔐 School ERP sign-in page ready."
  );

})();

</script>

</body>
</html>
