<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · SchoolERP</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
  </script>

  <style>
    /* ── Same CSS as before – keep it ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0b0e1a;
      color: #f0f4fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
      padding: 2.8rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .brand h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #f0f4fe 60%, #6c8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .role-toggle {
      display: flex;
      gap: 0.5rem;
      margin: 1.2rem 0 1.5rem;
      background: rgba(255,255,255,0.04);
      padding: 0.3rem;
      border-radius: 3rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .role-toggle button {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.65);
      transition: 0.3s;
    }
    .role-toggle button.active {
      background: rgba(108,140,255,0.2);
      color: #fff;
      box-shadow: 0 4px 16px rgba(108,140,255,0.15);
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #f0f4fe;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus {
      border-color: rgba(108,140,255,0.4);
      background: rgba(255,255,255,0.06);
    }
    .error-msg {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.15);
      border-radius: 1rem;
      padding: 0.7rem 1rem;
      font-size: 0.8rem;
      color: #ff6b6b;
      margin-bottom: 1.2rem;
      display: none;
    }
    .error-msg.show { display: block; }
    .btn-signin {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 3rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      background: linear-gradient(135deg, #6c8cff, #5a6fd6);
      color: #fff;
      box-shadow: 0 8px 30px rgba(108,140,255,0.25);
    }
    .btn-signin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(108,140,255,0.35);
    }
    .btn-signin:disabled { opacity: 0.6; cursor: not-allowed; }
    .demo-cred {
      margin-top: 1.5rem;
      padding: 0.8rem;
      background: rgba(245,215,66,0.06);
      border-radius: 1rem;
      border: 1px solid rgba(245,215,66,0.08);
      font-size: 0.75rem;
      color: rgba(255,255,255,0.65);
    }
    .demo-cred strong { color: #f5d742; }
    .demo-cred .cred-row { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-top: 0.3rem; }
    .demo-cred .cred-row code { background: rgba(255,255,255,0.06); padding: 0.15rem 0.8rem; border-radius: 1rem; color: #f0f4fe; }
    .fill-btn { background: none; border: none; color: #6c8cff; cursor: pointer; text-decoration: underline; font-size: 0.7rem; }
    .footer-link { margin-top: 1.5rem; font-size: 0.7rem; color: rgba(255,255,255,0.35); }
    .footer-link a { color: rgba(255,255,255,0.65); text-decoration: none; }
    .footer-link a:hover { color: #fff; }
    @media (max-width: 480px) { .glass { padding: 2rem 1.5rem; } }
  </style>
</head>
<body>

<div class="glass">
  <div class="brand">
    <h1>🏫 ERP Portal</h1>
    <div style="font-size:0.75rem; color:rgba(255,255,255,0.5);">GPS Pethgam Wagoora</div>
  </div>

  <div class="role-toggle">
    <button class="active" data-role="admin">👤 Admin</button>
    <button data-role="teacher">👨‍🏫 Teacher</button>
    <button data-role="student">👩‍🎓 Student</button>
  </div>

  <div class="error-msg" id="errorMsg"><span id="errorText"></span></div>

  <form id="signinForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="admin@demo.com" value="admin@demo.com" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" value="123456" required />
    </div>
    <button type="submit" class="btn-signin" id="signinBtn">🚀 Sign In</button>
  </form>

  <div class="demo-cred">
    <div style="opacity:0.6; margin-bottom:0.3rem;">🔑 Trial Credentials</div>
    <div class="cred-row">
      <span><strong>Email</strong> <code>admin@demo.com</code> <button class="fill-btn" data-field="email">fill</button></span>
      <span><strong>Password</strong> <code>123456</code> <button class="fill-btn" data-field="password">fill</button></span>
    </div>
  </div>

  <div class="footer-link">
    <a href="forgot-password.html">Forgot password?</a> &middot;
    <a href="index.html">Back to home</a>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ---- DOM refs ----
    const form = document.getElementById('signinForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signinBtn = document.getElementById('signinBtn');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const roleBtns = document.querySelectorAll('.role-toggle button');
    let selectedRole = 'admin';

    // ---- Role toggle ----
    roleBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        roleBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedRole = this.dataset.role;
        hideError();
      });
    });

    // ---- Fill demo credentials ----
    document.querySelectorAll('.fill-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const field = this.dataset.field;
        if (field === 'email') {
          emailInput.value = 'admin@demo.com';
          emailInput.focus();
        } else {
          passwordInput.value = '123456';
          passwordInput.focus();
        }
        hideError();
      });
    });

    // ---- Error helpers ----
    function showError(msg) {
      errorText.textContent = msg || 'Invalid credentials.';
      errorMsg.classList.add('show');
    }
    function hideError() {
      errorMsg.classList.remove('show');
    }

    // ---- Firebase config (from your init-firebase.js) ----
    const firebaseConfig = {
      apiKey: "AIzaSyDgVFdfKpCrLkoRsMI2gS7ajlJUzVdYLZU",
      authDomain: "pry-school-pethgam-wagoora.firebaseapp.com",
      projectId: "pry-school-pethgam-wagoora",
      storageBucket: "pry-school-pethgam-wagoora.firebasestorage.app",
      messagingSenderId: "255417366612",
      appId: "1:255417366612:web:81cec46aa75cb7d4ba95c1",
      measurementId: "G-JE9WY9T6FJ"
    };

    // ---- Initialize Firebase ----
    let auth = null;
    let firebaseInitialized = false;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      firebaseInitialized = true;
      console.log('✅ Firebase initialized.');
    } catch (e) {
      console.warn('Firebase init error:', e);
    }

    // ---- Sign in handler ----
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      signinBtn.disabled = true;
      signinBtn.textContent = '⏳ Signing in...';

      // If Firebase is not available → DEMO MODE
      if (!firebaseInitialized || !auth) {
        if (email === 'admin@demo.com' && password === '123456') {
          // Demo success
          localStorage.setItem('userRole', selectedRole);
          localStorage.setItem('userEmail', email);
          setTimeout(() => {
            window.location.href = 'master-profile.html';
          }, 800);
        } else {
          showError('Invalid credentials. Use admin@demo.com / 123456');
          signinBtn.disabled = false;
          signinBtn.textContent = '🚀 Sign In';
        }
        return;
      }

      // ---- Real Firebase Auth ----
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log('✅ Signed in:', user.email);
          // Save role (we use the selected role for now, later fetch from Firestore)
          localStorage.setItem('userRole', selectedRole);
          localStorage.setItem('userEmail', user.email);
          window.location.href = 'master-profile.html';
        })
        .catch((error) => {
          console.error('Auth error:', error);
          let msg = 'Invalid email or password.';
          if (error.code === 'auth/user-not-found') {
            msg = 'No account found with this email. Please sign up.';
          } else if (error.code === 'auth/wrong-password') {
            msg = 'Incorrect password.';
          } else if (error.code === 'auth/too-many-requests') {
            msg = 'Too many failed attempts. Try again later.';
          }
          showError(msg);
          signinBtn.disabled = false;
          signinBtn.textContent = '🚀 Sign In';
        });
    });

    // ---- Clear error on input ----
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);

    console.log('🔐 Sign-in page ready.');
    if (!firebaseInitialized) {
      console.warn('⚠️ Firebase not initialized – running in DEMO mode.');
    } else {
      console.log('📝 Use a real Firebase user or demo admin@demo.com / 123456');
    }
  })();
</script>
</body>
</html>
